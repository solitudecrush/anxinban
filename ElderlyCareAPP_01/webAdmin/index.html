<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>社区养老管理端 - 登录</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      min-height: 100vh;
    }

    .auth-container {
      display: flex;
      min-height: 100vh;
    }

    /* 左侧大图 */
    .auth-left {
      flex: 1;
      background: linear-gradient(160deg, #1a365d 0%, #2c5282 40%, #3182ce 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px;
      color: #fff;
      position: relative;
      overflow: hidden;
    }

    .auth-left::before {
      content: '';
      position: absolute;
      top: -100px;
      right: -100px;
      width: 400px;
      height: 400px;
      background: rgba(255,255,255,0.04);
      border-radius: 50%;
    }

    .auth-left::after {
      content: '';
      position: absolute;
      bottom: -150px;
      left: -100px;
      width: 500px;
      height: 500px;
      background: rgba(255,255,255,0.03);
      border-radius: 50%;
    }

    .auth-illustration {
      margin-bottom: 32px;
      opacity: 0.9;
      position: relative;
      z-index: 1;
    }
    .auth-illustration .material-icons {
      font-size: 96px;
    }

    .auth-left h2 {
      font-size: 32px;
      font-weight: 600;
      margin-bottom: 16px;
      position: relative;
      z-index: 1;
    }

    .auth-left p {
      font-size: 16px;
      opacity: 0.75;
      line-height: 1.8;
      text-align: center;
      max-width: 360px;
      position: relative;
      z-index: 1;
    }

    .auth-left .features {
      margin-top: 40px;
      display: flex;
      gap: 32px;
      position: relative;
      z-index: 1;
    }

    .auth-left .feature-item {
      text-align: center;
    }

    .auth-left .feature-item .icon {
      margin-bottom: 8px;
    }

    .auth-left .feature-item .label {
      font-size: 13px;
      opacity: 0.7;
    }

    /* 右侧表单区域 */
    .auth-right {
      width: 480px;
      min-width: 420px;
      background: #fff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 48px 56px;
    }

    .auth-header {
      margin-bottom: 32px;
    }

    .auth-header h1 {
      font-size: 26px;
      font-weight: 600;
      color: #1a202c;
      margin-bottom: 6px;
    }

    .auth-header p {
      font-size: 14px;
      color: #718096;
    }

    /* 表单 */
    .auth-form {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 14px;
      color: #4a5568;
      font-weight: 500;
    }

    .form-group input[type="text"],
    .form-group input[type="password"],
    .form-group input[type="tel"] {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      font-size: 14px;
      color: #1a202c;
      background: #fff;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-group input:focus {
      border-color: #3182ce;
      box-shadow: 0 0 0 3px rgba(49,130,206,0.08);
    }

    .form-group input::placeholder {
      color: #a0aec0;
    }

    /* 验证码行 */
    .code-row {
      display: flex;
      gap: 10px;
    }

    .code-row input {
      flex: 1;
    }

    .code-row button {
      padding: 0 16px;
      white-space: nowrap;
      border: 1px solid #3182ce;
      background: #fff;
      color: #3182ce;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .code-row button:hover {
      background: #3182ce;
      color: #fff;
    }

    .code-row button:disabled {
      border-color: #cbd5e0;
      color: #a0aec0;
      cursor: not-allowed;
      background: #f7fafc;
    }

    /* 记住密码行 */
    .remember-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
    }

    .remember-row .left {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #4a5568;
      cursor: pointer;
    }

    .remember-row input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: #3182ce;
      cursor: pointer;
    }

    .remember-row a {
      color: #3182ce;
      text-decoration: none;
      font-size: 13px;
    }

    .remember-row a:hover {
      text-decoration: underline;
    }

    /* 登录按钮 */
    .btn-submit {
      width: 100%;
      padding: 14px;
      background: #3182ce;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-submit:hover {
      background: #2b6cb0;
    }

    /* 底部链接 */
    .auth-footer {
      margin-top: 24px;
      text-align: center;
      font-size: 13px;
      color: #718096;
    }

    .auth-footer a {
      color: #3182ce;
      text-decoration: none;
      font-weight: 500;
    }

    .auth-footer a:hover {
      text-decoration: underline;
    }

    /* 错误提示 */
    .auth-error {
      padding: 10px 14px;
      background: #fff5f5;
      border: 1px solid #feb2b2;
      border-radius: 6px;
      color: #c53030;
      font-size: 13px;
      display: none;
    }

    .auth-error.show {
      display: block;
    }

    /* 页面切换动画 */
    .auth-panel {
      display: none;
    }

    .auth-panel.active {
      display: block;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* 响应式 */
    @media (max-width: 900px) {
      .auth-left { display: none; }
      .auth-right {
        width: 100%;
        min-width: auto;
        padding: 40px 32px;
      }
    }
  </style>
</head>
<body>
  <div class="auth-container">
    <!-- 左侧插图 -->
    <div class="auth-left">
      <div class="auth-illustration"><i class="material-icons">health_and_safety</i></div>
      <h2>智慧养老管理平台</h2>
      <p>科技赋能养老，数据守护健康<br>让每一位老人都能享受有尊严、有品质的晚年生活</p>
      <div class="features">
        <div class="feature-item">
          <div class="icon"><i class="material-icons" style="font-size:28px;">dashboard</i></div>
          <div class="label">数据大屏</div>
        </div>
        <div class="feature-item">
          <div class="icon"><i class="material-icons" style="font-size:28px;">videocam</i></div>
          <div class="label">实时监控</div>
        </div>
        <div class="feature-item">
          <div class="icon"><i class="material-icons" style="font-size:28px;">assignment</i></div>
          <div class="label">工单管理</div>
        </div>
        <div class="feature-item">
          <div class="icon"><i class="material-icons" style="font-size:28px;">notification_important</i></div>
          <div class="label">智能告警</div>
        </div>
      </div>
    </div>

    <!-- 右侧表单 -->
    <div class="auth-right">
      <!-- 登录 -->
      <div id="panel-login" class="auth-panel active">
        <div class="auth-header">
          <h1>欢迎登录</h1>
          <p>请使用您的社区工作人员账号登录系统</p>
        </div>
        <form class="auth-form" id="form-login">
          <div class="form-group">
            <label>账号</label>
            <input type="text" id="login-account" placeholder="请输入账号" value="shequ01" required>
          </div>
          <div class="form-group">
            <label>密码</label>
            <input type="password" id="login-password" placeholder="请输入密码" value="123456" required>
          </div>
          <div class="remember-row">
            <label class="left"><input type="checkbox" id="login-remember"> 记住密码</label>
            <a href="#" onclick="showPanel('forgot')">忘记密码？</a>
          </div>
          <button type="submit" class="btn-submit">登 录</button>
          <div id="login-error" class="auth-error"></div>
        </form>
        <div class="auth-footer">
          还没有账号？<a href="#" onclick="showPanel('register')">注册账号</a>
        </div>
      </div>

      <!-- 注册 -->
      <div id="panel-register" class="auth-panel">
        <div class="auth-header">
          <h1>注册账号</h1>
          <p>创建社区工作人员账号</p>
        </div>
        <form class="auth-form" id="form-register">
          <div class="form-group">
            <label>手机号</label>
            <input type="tel" id="reg-phone" placeholder="请输入手机号" maxlength="11" required>
          </div>
          <div class="form-group">
            <label>验证码</label>
            <div class="code-row">
              <input type="text" id="reg-code" placeholder="请输入验证码" maxlength="6" required>
              <button type="button" id="btn-reg-code" onclick="sendCode('reg')">获取验证码</button>
            </div>
          </div>
          <div class="form-group">
            <label>密码</label>
            <input type="password" id="reg-password" placeholder="请设置密码（至少6位）" minlength="6" required>
          </div>
          <div class="form-group">
            <label>确认密码</label>
            <input type="password" id="reg-password2" placeholder="请再次输入密码" minlength="6" required>
          </div>
          <button type="submit" class="btn-submit">注 册</button>
          <div id="register-error" class="auth-error"></div>
        </form>
        <div class="auth-footer">
          已有账号？<a href="#" onclick="showPanel('login')">去登录</a>
        </div>
      </div>

      <!-- 忘记密码 -->
      <div id="panel-forgot" class="auth-panel">
        <div class="auth-header">
          <h1>重置密码</h1>
          <p>通过手机号验证重置您的密码</p>
        </div>
        <form class="auth-form" id="form-forgot">
          <div class="form-group">
            <label>手机号</label>
            <input type="tel" id="forgot-phone" placeholder="请输入手机号" maxlength="11" required>
          </div>
          <div class="form-group">
            <label>验证码</label>
            <div class="code-row">
              <input type="text" id="forgot-code" placeholder="请输入验证码" maxlength="6" required>
              <button type="button" id="btn-forgot-code" onclick="sendCode('forgot')">获取验证码</button>
            </div>
          </div>
          <div class="form-group">
            <label>新密码</label>
            <input type="password" id="forgot-password" placeholder="请设置新密码（至少6位）" minlength="6" required>
          </div>
          <div class="form-group">
            <label>确认新密码</label>
            <input type="password" id="forgot-password2" placeholder="请再次输入新密码" minlength="6" required>
          </div>
          <button type="submit" class="btn-submit">重 置 密 码</button>
          <div id="forgot-error" class="auth-error"></div>
        </form>
        <div class="auth-footer">
          <a href="#" onclick="showPanel('login')">返回登录</a>
        </div>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/mock-data.js"></script>
  <script src="js/utils.js"></script>
  <script>
    // 页面切换
    function showPanel(name) {
      document.querySelectorAll('.auth-panel').forEach(p => p.classList.remove('active'));
      document.getElementById('panel-' + name).classList.add('active');
      document.querySelectorAll('.auth-error').forEach(e => { e.textContent = ''; e.classList.remove('show'); });
    }

    function showError(id, msg) {
      const el = document.getElementById(id);
      el.textContent = msg;
      el.classList.add('show');
    }

    let codeTimers = {};
    function sendCode(type) {
      const phoneInput = document.getElementById(type + '-phone');
      const phone = phoneInput?.value.trim();
      if (!phone || phone.length !== 11) {
        showError(type + '-error', '请输入正确的11位手机号');
        return;
      }
      alert('验证码：123456');

      const btn = document.getElementById('btn-' + type + '-code');
      let sec = 60;
      btn.disabled = true;
      btn.textContent = sec + 's后重试';
      codeTimers[type] = setInterval(() => {
        sec--;
        if (sec <= 0) {
          clearInterval(codeTimers[type]);
          btn.disabled = false;
          btn.textContent = '获取验证码';
        } else {
          btn.textContent = sec + 's后重试';
        }
      }, 1000);
    }

    // 登录
    document.getElementById('form-login').addEventListener('submit', async function(e) {
      e.preventDefault();
      const account = document.getElementById('login-account').value.trim();
      const password = document.getElementById('login-password').value.trim();

      try {
        const data = await AuthAPI.login(account, password);
        localStorage.setItem('is_logged_in', 'true');
        localStorage.setItem('current_user', data.name || account);
        localStorage.setItem('current_staff', JSON.stringify(data));
        if (data.accessToken) localStorage.setItem('access_token', data.accessToken);
        if (document.getElementById('login-remember').checked) {
          localStorage.setItem('login_remember', JSON.stringify({ account, password }));
        } else {
          localStorage.removeItem('login_remember');
        }
        addAuditLog('登录系统', '工作人员 ' + (data.name || account) + '（' + (data.role || 'staff') + '）登录系统');
        window.location.href = 'dashboard.html';
      } catch (err) {
        showError('login-error', err.message || '账号或密码错误');
      }
    });

    // 注册
    document.getElementById('form-register').addEventListener('submit', async function(e) {
      e.preventDefault();
      const phone = document.getElementById('reg-phone').value.trim();
      const code = document.getElementById('reg-code').value.trim();
      const pwd = document.getElementById('reg-password').value;
      const pwd2 = document.getElementById('reg-password2').value;

      if (phone.length !== 11) { showError('register-error', '请输入正确的11位手机号'); return; }
      if (code !== '123456') { showError('register-error', '验证码错误，演示验证码：123456'); return; }
      if (pwd.length < 6) { showError('register-error', '密码长度不能少于6位'); return; }
      if (pwd !== pwd2) { showError('register-error', '两次输入的密码不一致'); return; }

      try {
        await AuthAPI.register({ name: phone, phone, password: pwd, verifyCode: code });
        alert('注册成功！请使用手机号 ' + phone + ' 登录');
        showPanel('login');
        document.getElementById('login-account').value = phone;
        document.getElementById('login-password').value = pwd;
      } catch (err) {
        showError('register-error', err.message || '注册失败');
      }
    });

    // 忘记密码
    document.getElementById('form-forgot').addEventListener('submit', async function(e) {
      e.preventDefault();
      const phone = document.getElementById('forgot-phone').value.trim();
      const code = document.getElementById('forgot-code').value.trim();
      const pwd = document.getElementById('forgot-password').value;
      const pwd2 = document.getElementById('forgot-password2').value;

      if (phone.length !== 11) { showError('forgot-error', '请输入正确的11位手机号'); return; }
      if (code !== '123456') { showError('forgot-error', '验证码错误，演示验证码：123456'); return; }
      if (pwd.length < 6) { showError('forgot-error', '密码长度不能少于6位'); return; }
      if (pwd !== pwd2) { showError('forgot-error', '两次输入的密码不一致'); return; }

      try {
        await AuthAPI.resetPassword(phone, pwd);
        alert('密码重置成功！请使用新密码登录');
        showPanel('login');
        document.getElementById('login-account').value = phone;
        document.getElementById('login-password').value = pwd;
      } catch (err) {
        showError('forgot-error', err.message || '重置密码失败');
      }
    });

    // 记住密码回填
    (function() {
      const saved = localStorage.getItem('login_remember');
      if (saved) {
        try {
          const data = JSON.parse(saved);
          document.getElementById('login-account').value = data.account || '';
          document.getElementById('login-password').value = data.password || '';
          document.getElementById('login-remember').checked = true;
        } catch (e) {}
      }
    })();
  </script>
</body>
</html>
