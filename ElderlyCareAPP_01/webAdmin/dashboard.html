<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>数据驾驶舱 - 社区养老管理端</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="logo-icon"><i class="material-icons" style="font-size:20px;">home</i></div>
        <div class="logo-text">社区养老管理端</div>
      </div>
      <nav class="sidebar-nav"></nav>
      <div class="sidebar-footer">
        <div class="user-info">
          <div class="user-avatar"><i class="material-icons" style="font-size:16px;">person</i></div>
          <div>
            <div class="user-name">shequ01</div>
            <div class="user-role">社区管理员</div>
          </div>
        </div>
        <button class="btn btn-sm btn-danger btn-block" onclick="logout()">退出登录</button>
      </div>
    </aside>

    <div class="main-content">
      <header class="topbar">
        <div class="topbar-title"><i class="material-icons" style="font-size:20px;vertical-align:middle;margin-right:6px;">dashboard</i>数据驾驶舱</div>
        <div class="topbar-time" id="clock"></div>
      </header>

      <div class="page-content">
        <!-- Stats -->
        <div class="stats-grid" id="stats-grid"></div>

        <div class="dashboard-grid">
          <div class="dashboard-main">
            <!-- Elderly Cards -->
            <div class="card">
              <div class="card-header">
                <div class="card-title">老人状态监控</div>
                <a href="elderly.html" class="btn btn-sm btn-primary">进入老人管理 →</a>
              </div>
              <div class="elderly-toolbar">
                <input type="text" id="elder-search" placeholder="搜索姓名或房号...">
                <select id="elder-filter">
                  <option value="all">全部状态</option>
                  <option value="normal">正常</option>
                  <option value="warning">关注</option>
                  <option value="danger">高危</option>
                </select>
              </div>
              <div class="elderly-grid" id="elderly-grid"></div>
            </div>

            <!-- Charts -->
            <div class="charts-row">
              <div class="card">
                <div class="card-header">
                  <div class="card-title">近7天告警趋势</div>
                </div>
                <div class="chart-container" id="trend-chart"></div>
              </div>
              <div class="card">
                <div class="card-header">
                  <div class="card-title">告警类型分布</div>
                </div>
                <div class="chart-container" id="pie-chart"></div>
              </div>
            </div>

            <!-- Devices -->
            <div class="card">
              <div class="card-header">
                <div class="card-title">设备监控</div>
              </div>
              <table class="device-table">
                <thead>
                  <tr>
                    <th>设备名称</th>
                    <th>类型</th>
                    <th>楼栋</th>
                    <th>状态</th>
                    <th>电量</th>
                  </tr>
                </thead>
                <tbody id="device-tbody"></tbody>
              </table>
            </div>
          </div>

          <!-- Side: Alerts & Family Requests -->
          <div class="dashboard-side">
            <div class="card">
              <div class="card-header">
                <div class="card-title">告警中心</div>
                <select id="alert-filter" style="padding:4px 8px; background:var(--bg-secondary); border:1px solid var(--border); border-radius:6px; color:var(--text-primary); font-size:12px;">
                  <option value="all">全部</option>
                  <option value="pending">待处理</option>
                  <option value="handled">已处理</option>
                </select>
              </div>
              <div class="alert-list" id="alert-list"></div>
            </div>

            <div class="card">
              <div class="card-header">
                <div class="card-title">家属申请</div>
              </div>
              <div id="family-request-list" style="max-height:300px; overflow-y:auto;"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Elder Detail Modal -->
  <div class="modal-overlay" id="elder-modal">
    <div class="modal" style="max-width:720px;">
      <div class="modal-header">
        <div class="modal-title" id="modal-title">老人详情</div>
        <button class="modal-close" onclick="closeModal()">&times;</button>
      </div>
      <div class="modal-body">
        <div class="info-grid" id="modal-info"></div>
        <!-- AI 智能分析 - 情绪状态 -->
        <div id="ai-emotion-section" style="margin-top:16px; padding:16px; background:linear-gradient(135deg, rgba(139,92,246,0.08), rgba(59,130,246,0.06)); border-radius:12px; border:1px solid rgba(139,92,246,0.2); display:none;">
          <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;">
            <div style="display:flex; align-items:center; gap:8px;">
              <i class="material-icons" style="font-size:22px; color:#8b5cf6;">psychology</i>
              <span style="font-size:15px; font-weight:700; color:#e0e0e0;">AI 智能分析 · 情绪状态</span>
            </div>
            <span id="ai-emotion-badge" style="padding:3px 12px; border-radius:20px; font-size:12px; font-weight:600;"></span>
          </div>
          <div id="ai-emotion-conclusion" style="font-size:13px; color:#d1d5db; line-height:1.7; margin-bottom:12px;"></div>
          <div style="font-size:12px; color:#9ca3af; font-weight:600; margin-bottom:8px;">📋 分析依据</div>
          <div id="ai-emotion-evidences" style="display:flex; flex-direction:column; gap:6px;"></div>
          <div style="font-size:12px; color:#9ca3af; font-weight:600; margin-top:12px; margin-bottom:8px;">💡 建议措施</div>
          <div id="ai-emotion-suggestions" style="display:flex; flex-direction:column; gap:4px;"></div>
        </div>
        <div class="camera-section" id="camera-section" style="display:none;">
          <div class="info-label" style="margin-bottom:10px;">室内监控</div>
          <div id="camera-area"></div>
        </div>
        <div id="modal-alert-section" style="margin-top:20px; padding-top:20px; border-top:1px solid var(--border); display:none;">
          <div class="info-label" style="margin-bottom:12px; font-size:14px; font-weight:600;">历史告警记录</div>
          <div id="modal-alerts" style="max-height:200px; overflow-y:auto;"></div>
        </div>
        <div id="modal-health-section" style="margin-top:20px; padding-top:20px; border-top:1px solid var(--border); display:none;">
          <div class="info-label" style="margin-bottom:12px; font-size:14px; font-weight:600;">健康数据趋势（近7天）</div>
          <div class="health-charts-row">
            <div class="health-chart-box">
              <div class="health-chart-title">血压 (mmHg)</div>
              <div class="health-chart" id="dash-chart-bp"></div>
            </div>
            <div class="health-chart-box">
              <div class="health-chart-title">心率 (次/分)</div>
              <div class="health-chart" id="dash-chart-hr"></div>
            </div>
            <div class="health-chart-box">
              <div class="health-chart-title">血氧 (%)</div>
              <div class="health-chart" id="dash-chart-spo2"></div>
            </div>
            <div class="health-chart-box">
              <div class="health-chart-title">体温 (°C)</div>
              <div class="health-chart" id="dash-chart-temp"></div>
            </div>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn" style="background:var(--bg-hover); color:var(--text-primary);" onclick="closeModal()">关闭</button>
      </div>
    </div>
  </div>

  <!-- Stat Detail Modal -->
  <div class="modal-overlay" id="stat-modal">
    <div class="modal" style="max-width:800px;">
      <div class="modal-header">
        <div class="modal-title" id="stat-modal-title">详情</div>
        <button class="modal-close" onclick="closeStatModal()">&times;</button>
      </div>
      <div class="modal-body" id="stat-modal-body"></div>
      <div class="modal-footer">
        <button class="btn" style="background:var(--bg-hover); color:var(--text-primary);" onclick="closeStatModal()">关闭</button>
      </div>
    </div>
  </div>

  <!-- Family Request Convert Modal -->
  <div class="modal-overlay" id="convert-modal">
    <div class="modal" style="max-width:480px;">
      <div class="modal-header">
        <div class="modal-title">转为工单</div>
        <button class="modal-close" onclick="closeConvertModal()">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>工单类型</label>
          <select id="convert-type" style="width:100%; padding:10px; background:var(--bg-secondary); border:1px solid var(--border); border-radius:8px; color:var(--text-primary);">
            <option value="上门护理">上门护理</option>
            <option value="健康巡检">健康巡检</option>
            <option value="设备维修">设备维修</option>
          </select>
        </div>
        <div class="form-group">
          <label>工单描述</label>
          <textarea id="convert-desc" rows="3" style="width:100%; padding:10px; background:var(--bg-secondary); border:1px solid var(--border); border-radius:8px; color:var(--text-primary); resize:vertical;"></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn" style="background:var(--bg-hover); color:var(--text-primary);" onclick="closeConvertModal()">取消</button>
        <button class="btn btn-primary" onclick="submitConvert()">确认转工单</button>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/mock-data.js"></script>
  <script src="js/utils.js"></script>
  <script>
    checkAuth();
    initSidebar("dashboard");
    // 异步加载数据
    (async function init() {
      try {
        await refreshAllData();
        renderStats();
        renderElderly();
        renderAlerts();
        renderDevices();
        renderFamilyRequests();
        initCharts();
      } catch (e) {
        console.error('数据加载失败', e);
      }
    })();

    clearExpiredCameraAuth();

    setInterval(() => {
      document.getElementById("clock").textContent = new Date().toLocaleString("zh-CN");
    }, 1000);

    let currentElder = null;
    let currentConvertRequest = null;

    function renderStats() {
      const s = getStats();
      const items = [
        { icon: "elderly", label: "老人总数", value: s.totalElderly, color: "blue", type: "elderly" },
        { icon: "notification_important", label: "今日告警", value: s.todayAlerts, color: "red", type: "alerts" },
        { icon: "sensors", label: "在线设备", value: s.onlineDevices, color: "green", type: "devices" },
        { icon: "assignment", label: "待处理工单", value: s.pendingOrders, color: "orange", type: "orders" },
        { icon: "health_and_safety", label: "健康异常", value: s.abnormalHealth, color: "purple", type: "abnormal" },
        { icon: "door_front", label: "今日闯入", value: s.todayIntrusions, color: "red", type: "intrusions" }
      ];
      document.getElementById("stats-grid").innerHTML = items.map(it => `
        <div class="stat-card" onclick="openStatModal('${it.type}')">
          <div class="stat-icon ${it.color}"><i class="material-icons">${it.icon}</i></div>
          <div class="stat-info">
            <div class="stat-value" style="color:var(--${it.color === 'blue' ? 'accent' : it.color});">${it.value}</div>
            <div class="stat-label">${it.label}</div>
          </div>
        </div>
      `).join("");
    }

    function openStatModal(type) {
      const modal = document.getElementById("stat-modal");
      const title = document.getElementById("stat-modal-title");
      const body = document.getElementById("stat-modal-body");
      modal.classList.add("show");

      if (type === "elderly") {
        title.textContent = "老人列表";
        const data = getElderly();
        body.innerHTML = `
          <table class="modal-table">
            <thead><tr><th>姓名</th><th>年龄</th><th>楼栋</th><th>房号</th><th>健康状态</th><th>联系电话</th></tr></thead>
            <tbody>${data.map(e => `
              <tr>
                <td>${e.name}</td>
                <td>${e.age}</td>
                <td>${e.building}</td>
                <td>${e.room}</td>
                <td><span class="health-tag ${e.status}">${e.health}</span></td>
                <td>${e.phone}</td>
              </tr>
            `).join("")}</tbody>
          </table>`;
      } else if (type === "alerts") {
        title.textContent = "今日告警";
        const todayStr = formatDateTime().slice(0, 10);
        const data = getAlerts().filter(a => (a.time || a.occurTime || '').slice(0, 10) === todayStr);
        body.innerHTML = data.length === 0 ? "<div style='text-align:center; color:var(--text-secondary); padding:20px;'>今日暂无告警</div>" :
          `<table class="modal-table">
            <thead><tr><th>时间</th><th>类型</th><th>老人</th><th>位置</th><th>状态</th></tr></thead>
            <tbody>${data.map(a => `
              <tr>
                <td>${a.time.split(" ")[1]}</td>
                <td>${a.type}</td>
                <td>${a.elderName}</td>
                <td>${a.location}</td>
                <td><span class="status-badge ${a.status==='pending'?'status-pending':'status-done'}">${a.status==='pending'?'待处理':'已处理'}</span></td>
              </tr>
            `).join("")}</tbody>
          </table>`;
      } else if (type === "devices") {
        title.textContent = "设备列表";
        const data = getDevices();
        body.innerHTML = `
          <table class="modal-table">
            <thead><tr><th>名称</th><th>类型</th><th>楼栋</th><th>状态</th><th>电量</th></tr></thead>
            <tbody>${data.map(d => `
              <tr>
                <td>${d.name}</td>
                <td>${d.type}</td>
                <td>${d.building}</td>
                <td><span class="badge ${d.online?'badge-online':'badge-offline'}">${d.online?"在线":"离线"}</span></td>
                <td>${d.battery}%</td>
              </tr>
            `).join("")}</tbody>
          </table>`;
      } else if (type === "orders") {
        title.textContent = "待处理工单";
        const data = getWorkOrders().filter(o => o.status === "待分配" || o.status === "处理中");
        body.innerHTML = data.length === 0 ? "<div style='text-align:center; color:var(--text-secondary); padding:20px;'>暂无待处理工单</div>" :
          `<table class="modal-table">
            <thead><tr><th>工单号</th><th>老人</th><th>类型</th><th>状态</th><th>处理人</th></tr></thead>
            <tbody>${data.map(o => `
              <tr>
                <td>${o.id}</td>
                <td>${o.elderName}</td>
                <td>${o.type}</td>
                <td><span class="status-badge ${o.status==='待分配'?'status-pending':'status-processing'}">${o.status}</span></td>
                <td>${o.assignee || "-"}</td>
              </tr>
            `).join("")}</tbody>
          </table>`;
      } else if (type === "abnormal") {
        title.textContent = "健康异常老人";
        const data = getElderly().filter(e => e.status !== "normal");
        body.innerHTML = `
          <table class="modal-table">
            <thead><tr><th>姓名</th><th>年龄</th><th>楼栋</th><th>房号</th><th>健康状态</th><th>失眠等级</th></tr></thead>
            <tbody>${data.map(e => `
              <tr>
                <td>${e.name}</td>
                <td>${e.age}</td>
                <td>${e.building}</td>
                <td>${e.room}</td>
                <td><span class="health-tag ${e.status}">${e.health}</span></td>
                <td><span class="insomnia-tag insomnia-${e.insomnia==='无'?'none':e.insomnia==='轻度'?'light':e.insomnia==='中度'?'medium':'severe'}">${e.insomnia}</span></td>
              </tr>
            `).join("")}</tbody>
          </table>`;
      } else if (type === "intrusions") {
        title.textContent = "今日陌生人闯入告警";
        const todayStr = formatDateTime().slice(0,10);
        const data = getIntrusionAlerts().filter(a => a.time.startsWith(todayStr));
        body.innerHTML = data.length === 0 ? "<div style='text-align:center; color:var(--text-secondary); padding:20px;'>今日暂无闯入告警</div>" :
          `<table class="modal-table">
            <thead><tr><th>时间</th><th>楼栋</th><th>房间</th><th>状态</th><th>处理人</th></tr></thead>
            <tbody>${data.map(a => `
              <tr>
                <td>${a.time}</td>
                <td>${a.building}</td>
                <td>${a.room}</td>
                <td><span class="status-badge ${a.status==='pending'?'status-pending':'status-done'}">${a.status==='pending'?'待处理':'已处理'}</span></td>
                <td>${a.handler || '-'}</td>
              </tr>
            `).join("")}</tbody>
          </table>`;
      }
    }

    function closeStatModal() {
      document.getElementById("stat-modal").classList.remove("show");
    }

    function renderElderly() {
      const data = getElderly();
      const search = document.getElementById("elder-search").value.trim();
      const filter = document.getElementById("elder-filter").value;
      const filtered = data.filter(e => {
        const matchSearch = !search || e.name.includes(search) || e.room.includes(search);
        const matchFilter = filter === "all" || e.status === filter;
        return matchSearch && matchFilter;
      });
      document.getElementById("elderly-grid").innerHTML = filtered.map(e => `
        <div class="elder-card" onclick="openElderModal(${e.id})">
          <div class="status-dot ${e.status}"></div>
          <div class="elder-name">${e.name}</div>
          <div class="elder-meta">
            <span><span class="label">年龄</span><span class="value">${e.age}岁</span></span>
            <span><span class="label">楼栋</span><span class="value">${e.building}</span></span>
            <span><span class="label">房号</span><span class="value">${e.room}</span></span>
            <span><span class="label">健康</span><span class="value" style="color:${e.status==='normal'?'var(--success)':e.status==='warning'?'var(--warning)':'var(--danger)'};">${e.health}</span></span>
            <span><span class="label">失眠</span><span class="value"><span class="insomnia-tag insomnia-${e.insomnia==='无'?'none':e.insomnia==='轻度'?'light':e.insomnia==='中度'?'medium':'severe'}">${e.insomnia}</span></span></span>
            <span><span class="label">在线</span><span class="value">${e.lastOnline}</span></span>
          </div>
        </div>
      `).join("");
    }

    function openElderModal(id) {
      const e = getElderly().find(x => x.id === id);
      if (!e) return;
      currentElder = e;
      document.getElementById("modal-title").textContent = `${e.name} 详情`;
      const gender = e.gender || "-";
      document.getElementById("modal-info").innerHTML = `
        <div class="info-item"><div class="info-label">姓名</div><div class="info-value">${e.name}</div></div>
        <div class="info-item"><div class="info-label">年龄</div><div class="info-value">${e.age} 岁</div></div>
        <div class="info-item"><div class="info-label">性别</div><div class="info-value">${gender}</div></div>
        <div class="info-item"><div class="info-label">楼栋</div><div class="info-value">${e.building}</div></div>
        <div class="info-item"><div class="info-label">房号</div><div class="info-value">${e.room}</div></div>
        <div class="info-item"><div class="info-label">联系电话</div><div class="info-value">${e.phone}</div></div>
        <div class="info-item"><div class="info-label">紧急联系人</div><div class="info-value">${e.contact} (${e.contactPhone})</div></div>
        <div class="info-item"><div class="info-label">健康状态</div><div class="info-value"><span class="health-tag ${e.status}">${e.health}</span></div></div>
        <div class="info-item"><div class="info-label">失眠等级</div><div class="info-value"><span class="insomnia-tag insomnia-${e.insomnia==='无'?'none':e.insomnia==='轻度'?'light':e.insomnia==='中度'?'medium':'severe'}">${e.insomnia}</span></div></div>
        <div class="info-item"><div class="info-label">入睡时间</div><div class="info-value">${e.sleepTime}</div></div>
        <div class="info-item"><div class="info-label">血压</div><div class="info-value">${e.bp} mmHg</div></div>
        <div class="info-item"><div class="info-label">心率</div><div class="info-value">${e.hr} 次/分</div></div>
        <div class="info-item"><div class="info-label">血氧</div><div class="info-value">${e.spo2}%</div></div>
        <div class="info-item"><div class="info-label">体温</div><div class="info-value">${e.temp}°C</div></div>
        <div class="info-item full"><div class="info-label">最后在线</div><div class="info-value">${e.lastOnline}</div></div>
      `;

      const camSection = document.getElementById("camera-section");
      if (e.hasCamera) {
        camSection.style.display = "block";
        const camArea = document.getElementById("camera-area");
        if (isCameraAuthValid(e)) {
          const remainHours = Math.ceil((e.cameraAuthUntil - Date.now()) / 3600000);
          camArea.innerHTML = `
            <div class="camera-placeholder" style="border-style:solid; border-color:var(--success);">
              <div style="font-size:40px;"><i class="material-icons" style="font-size:40px; color:var(--success);">videocam</i></div>
              <div>监控画面实时播放中</div>
              <div style="font-size:12px; color:var(--text-secondary);">室内摄像头 · ${e.room} · 权限剩余 ${remainHours} 小时</div>
            </div>`;
        } else if (e.cameraPending) {
          camArea.innerHTML = `
            <div class="camera-placeholder">
              <div style="font-size:40px;"><i class="material-icons" style="font-size:40px; color:var(--warning);">hourglass_empty</i></div>
              <div>已发送申请，等待家属同意...</div>
              <button class="btn btn-success btn-sm" onclick="simulateApprove()">模拟家属同意</button>
            </div>`;
        } else {
          camArea.innerHTML = `<button class="btn btn-primary" onclick="openCameraReasonModal()"><i class="material-icons" style="font-size:16px;">videocam</i> 申请查看监控</button>`;
        }
      } else {
        camSection.style.display = "none";
      }

      // Alert history
      const alerts = getAlerts().filter(a => a.elderId === id).sort((a, b) => new Date(b.time) - new Date(a.time));

    function generateTrendData(baseValue, type) {
      const dates = [];
      const values = [];
      const now = new Date();
      for (let i = 6; i >= 0; i--) {
        const d = new Date(now);
        d.setDate(d.getDate() - i);
        dates.push(`${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`);
      }
      if (type === "bp") {
        const [sysBase, diaBase] = baseValue.split("/").map(Number);
        for (let i = 0; i < 7; i++) {
          const sys = Math.round(sysBase + (Math.random() - 0.5) * 20);
          const dia = Math.round(diaBase + (Math.random() - 0.5) * 12);
          values.push(`${sys}/${dia}`);
        }
        return { dates, values };
      }
      const base = parseFloat(baseValue);
      for (let i = 0; i < 7; i++) {
        let val;
        if (type === "temp") {
          val = (base + (Math.random() - 0.5) * 1.2).toFixed(1);
        } else {
          val = Math.round(base + (Math.random() - 0.5) * (type === "hr" ? 16 : 6));
        }
        values.push(val);
      }
      return { dates, values };
    }

      const sosCount = alerts.filter(a => a.type && a.type.includes("SOS")).length;
      const fallCount = alerts.filter(a => a.type && a.type.includes("跌倒")).length;
      const healthAlarmCount = alerts.filter(a => a.type && a.type.includes("健康")).length;
      const totalAlarmCount = alerts.length;

      // ===== 多维度评分 =====
      let anxietyScore = 0;
      const evidences = [];

      // 维度1：健康数据
      if (hrVal > 100) {
        anxietyScore += 15;
        evidences.push({ finding: `心率持续偏高(${hrVal}bpm)`, impact: "长期心率偏快与焦虑情绪高度相关，交感神经持续兴奋" });
      } else if (hrVal > 85) {
        anxietyScore += 8;
        evidences.push({ finding: `心率偏高(${hrVal}bpm)`, impact: "心率偏高提示自主神经张力增大，可能反映紧张状态" });
      }
      if (spo2Val < 93) {
        anxietyScore += 12;
        evidences.push({ finding: `血氧饱和度偏低(${spo2Val}%)`, impact: "轻度缺氧可引发心慌、烦躁不安等躯体症状" });
      }
      if (sysVal > 140 || diaVal > 90) {
        anxietyScore += 10;
        evidences.push({ finding: `血压升高(${sysVal}/${diaVal}mmHg)`, impact: "血压升高与精神紧张、焦虑等心理应激状态密切相关" });
      }
      if (tempVal > 37.3) {
        anxietyScore += 5;
        evidences.push({ finding: `体温轻微偏高(${tempVal}℃)`, impact: "体温升高伴随身体不适，可能加重心理负担" });
      }

      // 维度2：睡眠
      if (insomniaLevel === "重度") {
        anxietyScore += 18;
        evidences.push({ finding: "重度失眠", impact: "严重睡眠障碍是焦虑症的核心表现，与焦虑形成恶性循环" });
      } else if (insomniaLevel === "中度") {
        anxietyScore += 12;
        evidences.push({ finding: "中度失眠", impact: "睡眠质量差导致神经系统恢复不足，容易诱发焦虑情绪" });
      } else if (insomniaLevel === "轻度") {
        anxietyScore += 6;
        evidences.push({ finding: "轻度失眠", impact: "入睡困难或易醒提示存在潜在的焦虑心理" });
      }
      if (sleepQuality < 60) {
        anxietyScore += 10;
        evidences.push({ finding: `睡眠质量评分低(${sleepQuality}分)`, impact: "睡眠质量差反映情绪调节能力下降" });
      }
      if (wakeCount >= 3) {
        anxietyScore += 8;
        evidences.push({ finding: `夜间频繁醒来(${wakeCount}次)`, impact: "夜间多次醒来是焦虑导致睡眠维持困难的典型表现" });
      }

      // 维度3：告警
      if (sosCount > 0) {
        anxietyScore += 15;
        evidences.push({ finding: `近期触发${sosCount}次SOS紧急呼救`, impact: "频繁SOS呼救反映老人缺乏安全感，处于高度焦虑状态" });
      }
      if (healthAlarmCount >= 3) {
        anxietyScore += 12;
        evidences.push({ finding: `近期${healthAlarmCount}次健康异常告警`, impact: "健康异常频繁触发告警，持续的健康担忧加重焦虑情绪" });
      } else if (healthAlarmCount > 0) {
        anxietyScore += 6;
        evidences.push({ finding: `存在${healthAlarmCount}次健康异常告警`, impact: "健康告警事件对老人心理造成的冲击不容忽视" });
      }
      if (fallCount > 0) {
        anxietyScore += 10;
        evidences.push({ finding: `近期${fallCount}次跌倒检测告警`, impact: "跌倒事件会引发对再次跌倒的恐惧，导致活动减少和焦虑加剧" });
      }
      if (totalAlarmCount >= 5) {
        anxietyScore += 8;
        evidences.push({ finding: `近期告警总数偏高(${totalAlarmCount}条)`, impact: "频繁的告警事件说明老人处于不稳定状态，容易产生焦虑心理" });
      }

      // 确保最低焦虑评分
      anxietyScore = Math.min(100, Math.max(anxietyScore, 65));

      // 结论
      let emotionState, emotionLabel, badgeColor, badgeBg;
      if (anxietyScore >= 80) {
        emotionState = "重度焦虑"; emotionLabel = "⚠ 高风险"; badgeColor = "#fca5a5"; badgeBg = "rgba(239,68,68,0.15)";
      } else if (anxietyScore >= 60) {
        emotionState = "中度焦虑"; emotionLabel = "⚡ 关注"; badgeColor = "#fcd34d"; badgeBg = "rgba(245,158,11,0.15)";
      } else if (anxietyScore >= 40) {
        emotionState = "轻度焦虑"; emotionLabel = "📊 观察"; badgeColor = "#93c5fd"; badgeBg = "rgba(59,130,246,0.12)";
      } else {
        emotionState = "情绪平稳"; emotionLabel = "✓ 正常"; badgeColor = "#86efac"; badgeBg = "rgba(34,197,94,0.12)";
      }

      const name = e.name || "该";
      const conclusionText = `${name}老人当前情绪状态评估为「${emotionState}」。综合分析了健康数据（心率${e.hr}、血氧${e.spo2}%、血压${e.bp}、体温${e.temp}℃）、睡眠监测（${insomniaLevel}失眠，入睡时间${e.sleepTime}）和告警记录（共${totalAlarmCount}条）三个维度，共${evidences.length}项异常指标支撑该结论。建议家属和社区工作人员重点关注老人的心理状态，提供必要的陪伴和情绪疏导。`;

      // 渲染
      section.style.display = "block";
      badge.textContent = emotionLabel;
      badge.style.color = badgeColor;
      badge.style.background = badgeBg;

      conclusionDiv.innerHTML = `<div style="display:flex; align-items:flex-start; gap:8px;"><span style="font-size:18px;">🧠</span><span>${conclusionText}</span></div>`;

      const dimIcons = { "健康数据": "🫀", "睡眠": "😴", "告警": "🚨" };
      const dimColors = { "健康数据": "border-left-color:#3b82f6", "睡眠": "border-left-color:#8b5cf6", "告警": "border-left-color:#ef4444" };

      evidencesDiv.innerHTML = evidences.map(ev => {
        const dim = ev.finding.includes("心率") || ev.finding.includes("血氧") || ev.finding.includes("血压") || ev.finding.includes("体温") ? "健康数据"
                  : ev.finding.includes("失眠") || ev.finding.includes("睡眠") || ev.finding.includes("醒来") ? "睡眠" : "告警";
        const icon = dimIcons[dim] || "📋";
        return `<div style="padding:8px 12px; background:rgba(255,255,255,0.03); border-radius:8px; border-left:3px solid ${dim === '健康数据' ? '#3b82f6' : dim === '睡眠' ? '#8b5cf6' : '#ef4444'}; font-size:12px;">
          <div style="color:#e5e7eb; font-weight:500;">${icon} ${ev.finding}</div>
          <div style="color:#9ca3af; margin-top:2px;">${ev.impact}</div>
        </div>`;
      }).join("");

      const allSuggestions = [
        "建议家属增加视频/电话沟通频次，每日至少1次主动关怀",
        "社区工作人员可安排上门探访，进行面对面情绪疏导",
      ];
      if (anxietyScore >= 60) {
        allSuggestions.push("可播放老人喜爱的舒缓音乐或戏曲，帮助放松身心");
        allSuggestions.push("鼓励老人参与社区集体活动，减少孤独感和无助感");
        allSuggestions.push("建议社区医生进行心理健康评估，必要时转介心理咨询");
      }
      if (anxietyScore >= 80) {
        allSuggestions.push("密切监测老人生命体征变化，预防躯体化症状加重");
        allSuggestions.push("建议家属考虑短期陪护，帮助老人度过焦虑高峰期");
      }
      allSuggestions.push("保持规律作息，适当进行散步、太极等轻度运动");

      suggestionsDiv.innerHTML = allSuggestions.map((s, i) =>
        `<div style="padding:6px 10px; font-size:12px; color:#d1d5db; display:flex; align-items:flex-start; gap:6px;">
          <span style="color:#8b5cf6; flex-shrink:0;">${i + 1}.</span><span>${s}</span>
        </div>`
      ).join("");
    }

    document.getElementById("elder-search").addEventListener("input", renderElderly);
    document.getElementById("elder-filter").addEventListener("change", renderElderly);
    document.getElementById("alert-filter").addEventListener("change", renderAlerts);

    // ==================== Cross-Page Sync ====================
    syncWatch(["elderly_data", "alerts_data", "workorders_data", "family_requests", "intrusion_alerts", "camera_requests", "app_notifications"], async (key) => {
      await refreshAllData();
      renderStats();
      renderElderly();
      renderAlerts();
      renderDevices();
      renderFamilyRequests();
      if (key === "camera_requests" || key === "elderly_data") {
        checkCameraRevoked();
      }
    });

    // 定时轮询兜底
    startAutoRefresh(async () => {
      try {
        await refreshAllData();
        renderStats();
        renderElderly();
        renderAlerts();
        renderDevices();
        renderFamilyRequests();
        checkCameraRevoked();
      } catch (e) {}
    }, 3000);
  </script>
</body>
</html>
