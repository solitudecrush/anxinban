<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>工单管理 - 社区养老管理端</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="logo-icon"><i class="material-icons" style="font-size:20px;">home</i></div>
        <div class="logo-text">社区养老管理端</div>
      </div>
      <nav class="sidebar-nav"></nav>
      <div class="sidebar-footer">
        <div class="user-info">
          <div class="user-avatar"><i class="material-icons" style="font-size:16px;">person</i></div>
          <div>
            <div class="user-name">shequ01</div>
            <div class="user-role">社区管理员</div>
          </div>
        </div>
        <button class="btn btn-sm btn-danger btn-block" onclick="logout()">退出登录</button>
      </div>
    </aside>

    <div class="main-content">
      <header class="topbar">
        <div class="topbar-title"><i class="material-icons" style="font-size:20px;vertical-align:middle;margin-right:6px;">assignment</i>工单管理</div>
        <div class="topbar-time" id="clock"></div>
      </header>

      <div class="page-content">
        <!-- Tabs -->
        <div class="tabs-bar">
          <button class="tab-btn active" id="tab-btn-workorders" onclick="switchTab('workorders')">服务工单</button>
          <button class="tab-btn" id="tab-btn-family" onclick="switchTab('family')">
            家属申请
            <span class="tab-badge" id="family-badge">0</span>
          </button>
        </div>

        <!-- Workorders Panel -->
        <div id="panel-workorders">
          <div class="card">
            <div class="card-header">
              <div class="card-title">服务工单</div>
              <button class="btn btn-primary" onclick="openCreateModal()">+ 创建工单</button>
            </div>
            <div class="filter-bar">
              <input type="text" id="wo-search" placeholder="搜索老人姓名或工单号...">
              <select id="wo-filter-status">
                <option value="all">全部状态</option>
                <option value="待分配">待分配</option>
                <option value="处理中">处理中</option>
                <option value="已完成">已完成</option>
              </select>
              <select id="wo-filter-type">
                <option value="all">全部类型</option>
                <option value="上门护理">上门护理</option>
                <option value="健康巡检">健康巡检</option>
                <option value="设备维修">设备维修</option>
              </select>
            </div>
            <div style="overflow-x:auto;">
              <table class="data-table">
                <thead>
                  <tr>
                    <th>工单号</th>
                    <th>老人姓名</th>
                    <th>工单类型</th>
                    <th>创建时间</th>
                    <th>处理状态</th>
                    <th>处理人员</th>
                    <th>处理人电话</th>
                    <th>操作</th>
                  </tr>
                </thead>
                <tbody id="wo-tbody"></tbody>
              </table>
            </div>
          </div>
        </div>

        <!-- Family Requests Panel -->
        <div id="panel-family" style="display:none;">
          <div class="card">
            <div class="card-header">
              <div class="card-title">家属申请列表</div>
            </div>
            <div class="filter-bar">
              <input type="text" id="fr-search" placeholder="搜索老人姓名...">
              <select id="fr-filter-status">
                <option value="all">全部状态</option>
                <option value="pending">待处理</option>
                <option value="converted">已转为工单</option>
                <option value="completed">已完成</option>
                <option value="ignored">已拒绝</option>
              </select>
              <select id="fr-filter-type">
                <option value="all">全部类型</option>
                <option value="上门看护">上门看护</option>
                <option value="设备维修">设备维修</option>
                <option value="健康咨询">健康咨询</option>
                <option value="紧急求助">紧急求助</option>
                <option value="生活物资代购">生活物资代购</option>
              </select>
            </div>
            <div style="overflow-x:auto;">
              <table class="data-table">
                <thead>
                  <tr>
                    <th>申请老人</th>
                    <th>申请类型</th>
                    <th>申请时间</th>
                    <th>申请内容</th>
                    <th>家属信息</th>
                    <th>处理状态</th>
                    <th>关联工单</th>
                    <th>操作</th>
                  </tr>
                </thead>
                <tbody id="fr-tbody"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Create Modal -->
  <div class="modal-overlay" id="create-modal">
    <div class="modal" style="max-width:480px;">
      <div class="modal-header">
        <div class="modal-title">创建新工单</div>
        <button class="modal-close" onclick="closeCreateModal()">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>选择老人</label>
          <select id="wo-elder" style="width:100%; padding:10px; background:var(--bg-secondary); border:1px solid var(--border); border-radius:8px; color:var(--text-primary);"></select>
        </div>
        <div class="form-group">
          <label>工单类型</label>
          <select id="wo-type" style="width:100%; padding:10px; background:var(--bg-secondary); border:1px solid var(--border); border-radius:8px; color:var(--text-primary);">
            <option value="上门护理">上门护理</option>
            <option value="健康巡检">健康巡检</option>
            <option value="设备维修">设备维修</option>
          </select>
        </div>
        <div class="form-group">
          <label>工单描述</label>
          <textarea id="wo-desc" rows="3" style="width:100%; padding:10px; background:var(--bg-secondary); border:1px solid var(--border); border-radius:8px; color:var(--text-primary); resize:vertical;" placeholder="请输入工单详细描述..."></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn" style="background:var(--bg-hover); color:var(--text-primary);" onclick="closeCreateModal()">取消</button>
        <button class="btn btn-primary" onclick="submitCreate()">创建工单</button>
      </div>
    </div>
  </div>

  <!-- Assign Modal -->
  <div class="modal-overlay" id="assign-modal">
    <div class="modal" style="max-width:400px;">
      <div class="modal-header">
        <div class="modal-title">分配处理人员</div>
        <button class="modal-close" onclick="closeAssignModal()">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>选择人员</label>
          <select id="wo-assignee" style="width:100%; padding:10px; background:var(--bg-secondary); border:1px solid var(--border); border-radius:8px; color:var(--text-primary);">
            <option value="">请选择</option>
          </select>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn" style="background:var(--bg-hover); color:var(--text-primary);" onclick="closeAssignModal()">取消</button>
        <button class="btn btn-primary" onclick="submitAssign()">确认分配</button>
      </div>
    </div>
  </div>

  <!-- Convert Modal -->
  <div class="modal-overlay" id="convert-modal">
    <div class="modal" style="max-width:480px;">
      <div class="modal-header">
        <div class="modal-title">转为工单</div>
        <button class="modal-close" onclick="closeConvertModal()">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>工单类型</label>
          <select id="convert-type" style="width:100%; padding:10px; background:var(--bg-secondary); border:1px solid var(--border); border-radius:8px; color:var(--text-primary);">
            <option value="上门护理">上门护理</option>
            <option value="健康巡检">健康巡检</option>
            <option value="设备维修">设备维修</option>
          </select>
        </div>
        <div class="form-group">
          <label>工单描述</label>
          <textarea id="convert-desc" rows="3" style="width:100%; padding:10px; background:var(--bg-secondary); border:1px solid var(--border); border-radius:8px; color:var(--text-primary); resize:vertical;"></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn" style="background:var(--bg-hover); color:var(--text-primary);" onclick="closeConvertModal()">取消</button>
        <button class="btn btn-primary" onclick="submitConvert()">确认转工单</button>
      </div>
    </div>
  </div>

  <!-- Ignore Confirm Modal -->
  <div class="modal-overlay" id="ignore-modal">
    <div class="modal" style="max-width:400px;">
      <div class="modal-header">
        <div class="modal-title">确认忽略</div>
        <button class="modal-close" onclick="closeIgnoreModal()">&times;</button>
      </div>
      <div class="modal-body" style="text-align:center;">
        <div style="font-size:48px; margin-bottom:12px;"><i class="material-icons" style="font-size:48px; color:var(--warning);">warning</i></div>
        <div style="font-size:16px; font-weight:600; margin-bottom:8px;">确定要忽略该家属申请吗？</div>
        <div style="color:var(--text-secondary); font-size:13px;">忽略后申请状态将变为“已拒绝”。</div>
      </div>
      <div class="modal-footer" style="justify-content:center;">
        <button class="btn" style="background:var(--bg-hover); color:var(--text-primary);" onclick="closeIgnoreModal()">取消</button>
        <button class="btn btn-danger" onclick="confirmIgnore()">确认忽略</button>
      </div>
    </div>
  </div>

  <!-- Notify Toast -->
  <div class="toast-overlay" id="notify-toast">
    <div class="toast-box">
      <div class="toast-icon"><i class="material-icons" style="font-size:40px;">campaign</i></div>
      <div class="toast-title">已通知家属</div>
      <div class="toast-msg">工单已完成，系统已向家属发送通知</div>
      <button class="btn btn-primary btn-block" onclick="closeNotifyToast()">知道了</button>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/mock-data.js"></script>
  <script src="js/utils.js"></script>
  <script>
    checkAuth();
    initSidebar("workorders");
    (async function init() {
      try {
        await loadWorkOrders();
        await loadFamilyRequests();
        await loadElderly();
        await loadStaff();
        renderWorkOrders();
        updateFamilyBadge();
      } catch (e) {
        console.error('加载失败', e);
      }
    })();

    setInterval(() => {
      document.getElementById("clock").textContent = new Date().toLocaleString("zh-CN");
    }, 1000);

    let assignTargetId = null;
    let currentConvertRequest = null;
    let ignoreTargetId = null;

    function switchTab(tab) {
      document.getElementById("tab-btn-workorders").classList.toggle("active", tab === "workorders");
      document.getElementById("tab-btn-family").classList.toggle("active", tab === "family");
      document.getElementById("panel-workorders").style.display = tab === "workorders" ? "block" : "none";
      document.getElementById("panel-family").style.display = tab === "family" ? "block" : "none";
      if (tab === "family") {
        renderFamilyRequests();
      }
    }

    function updateFamilyBadge() {
      const count = getFamilyRequests().filter(r => r.status === "pending").length;
      const badge = document.getElementById("family-badge");
      badge.textContent = count;
      badge.style.display = count > 0 ? "inline-flex" : "none";
    }

    function renderWorkOrders() {
      const data = getWorkOrders();
      const search = document.getElementById("wo-search").value.trim();
      const statusFilter = document.getElementById("wo-filter-status").value;
      const typeFilter = document.getElementById("wo-filter-type").value;

      const filtered = data.filter(w => {
        const matchSearch = !search || w.id.includes(search) || w.elderName.includes(search);
        const matchStatus = statusFilter === "all" || w.status === statusFilter;
        const matchType = typeFilter === "all" || w.type === typeFilter;
        return matchSearch && matchStatus && matchType;
      });

      document.getElementById("wo-tbody").innerHTML = filtered.map(w => {
        const statusClass = w.status === "待分配" ? "status-pending" : w.status === "处理中" ? "status-processing" : "status-done";
        const familyBadge = w.fromFamily ? `<span class="badge-family">家属申请</span>` : "";
        let actions = "";
        if (w.status === "待分配") {
          actions = `<button class="btn btn-sm btn-primary" onclick="openAssignModal('${w.id}')">分配</button>`;
        } else if (w.status === "处理中") {
          actions = `<button class="btn btn-sm btn-success" onclick="completeOrder('${w.id}')">标记完成</button>`;
        } else {
          actions = `<span style="color:var(--text-secondary); font-size:12px;">已完成</span>`;
        }
        return `
          <tr>
            <td>${w.id}${familyBadge}</td>
            <td>${w.elderName}</td>
            <td>${w.type}</td>
            <td>${w.createTime}</td>
            <td><span class="status-badge ${statusClass}">${w.status}</span></td>
            <td>${w.assignee || "-"}</td>
            <td>${w.assigneePhone || "-"}</td>
            <td>${actions}</td>
          </tr>
        `;
      }).join("");
    }

    function openCreateModal() {
      const elderly = getElderly();
      document.getElementById("wo-elder").innerHTML = elderly.map(e => `<option value="${e.id}">${e.name}（${e.building} ${e.room}）</option>`).join("");
      document.getElementById("wo-type").value = "上门护理";
      document.getElementById("wo-desc").value = "";
      document.getElementById("create-modal").classList.add("show");
    }

    function closeCreateModal() {
      document.getElementById("create-modal").classList.remove("show");
    }

    async function submitCreate() {
      const elderId = parseInt(document.getElementById("wo-elder").value);
      const type = document.getElementById("wo-type").value;
      const desc = document.getElementById("wo-desc").value.trim();
      const elder = getElderly().find(e => e.id === elderId);
      if (!elder) return;

      try {
        await WorkOrderAPI.create({
          elderId: String(elderId),
          elderName: elder.name,
          orderType: type,
          description: desc || type + "服务",
          status: "待分配"
        });
        await loadWorkOrders();
        closeCreateModal();
        renderWorkOrders();
        addAuditLog("创建工单", `工作人员 ${getCurrentUser()} 创建工单，老人：${elder.name}`);
      } catch (err) {
        alert(err.message || '创建失败');
      }
    }

    function openAssignModal(id) {
      assignTargetId = id;
      const staff = getStaff();
      document.getElementById("wo-assignee").innerHTML = `
        <option value="">请选择</option>
        ${staff.map(s => `<option value="${s.name}" data-phone="${s.phone}">${s.name}（${s.role}）</option>`).join("")}
      `;
      document.getElementById("assign-modal").classList.add("show");
    }

    function closeAssignModal() {
      document.getElementById("assign-modal").classList.remove("show");
      assignTargetId = null;
    }

    async function submitAssign() {
      const select = document.getElementById("wo-assignee");
      const assignee = select.value;
      const phone = select.options[select.selectedIndex].dataset.phone || "";
      if (!assignee || !assignTargetId) return;
      try {
        const staffMember = getStaff().find(s => s.name === assignee);
        await WorkOrderAPI.assign(assignTargetId, staffMember?.staffId || assignee, assignee);
        await loadWorkOrders();
        renderWorkOrders();
        addAuditLog("分配工单", `工作人员 ${getCurrentUser()} 分配工单：${assignTargetId} 给 ${assignee}`);
      } catch (err) {
        alert(err.message || '分配失败');
      }
      closeAssignModal();
    }

    async function completeOrder(id) {
      try {
        await WorkOrderAPI.updateStatus(id, "已完成");
        await loadWorkOrders();
        await loadFamilyRequests();
        renderWorkOrders();
        addAuditLog("完成工单", `工作人员 ${getCurrentUser()} 标记工单完成：${id}`);
        document.getElementById("notify-toast").classList.add("show");
        notifyApp({
          type: "order",
          title: "工单已完成",
          content: `工单已处理完成`,
          orderId: id
        });
      } catch (err) {
        alert(err.message || '操作失败');
      }
    }

    function closeNotifyToast() {
      document.getElementById("notify-toast").classList.remove("show");
    }

    // Family Requests
    function renderFamilyRequests() {
      const data = getFamilyRequests();
      const search = document.getElementById("fr-search").value.trim();
      const statusFilter = document.getElementById("fr-filter-status").value;
      const typeFilter = document.getElementById("fr-filter-type").value;

      const filtered = data.filter(r => {
        const matchSearch = !search || r.elderName.includes(search);
        const matchStatus = statusFilter === "all" || r.status === statusFilter;
        const matchType = typeFilter === "all" || r.type === typeFilter;
        return matchSearch && matchStatus && matchType;
      });

      const tbody = document.getElementById("fr-tbody");
      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="8" style="text-align:center; color:var(--text-secondary); padding:40px;">暂无数据</td></tr>`;
        return;
      }

      tbody.innerHTML = filtered.map(r => {
        const statusMap = {
          pending: { text: "待处理", class: "status-pending" },
          converted: { text: "已转为工单", class: "status-processing" },
          completed: { text: "已完成", class: "status-done" },
          ignored: { text: "已拒绝", class: "status-ignored" }
        };
        const s = statusMap[r.status] || statusMap.pending;
        let actions = "";
        if (r.status === "pending") {
          actions = `
            <div class="table-actions">
              <button class="btn btn-sm btn-primary" onclick="openConvertModal(${r.id})">转为工单</button>
              <button class="btn btn-sm btn-danger" onclick="openIgnoreModal(${r.id})">忽略</button>
            </div>
          `;
        } else if (r.status === "converted") {
          actions = `<span style="color:var(--text-secondary); font-size:12px;">已转 ${r.convertedTo || ""}</span>`;
        } else if (r.status === "completed") {
          actions = `<span style="color:var(--success); font-size:12px;">工单已完成</span>`;
        } else {
          actions = `<span style="color:var(--text-secondary); font-size:12px;">已拒绝</span>`;
        }

        return `
          <tr>
            <td>${r.elderName}</td>
            <td>${r.type}</td>
            <td>${r.requestTime}</td>
            <td style="max-width:240px; white-space:normal;">${r.content}</td>
            <td>${r.familyName}<br><span style="color:var(--text-secondary); font-size:12px;">${r.familyPhone}</span></td>
            <td><span class="status-badge ${s.class}">${s.text}</span></td>
            <td>${r.convertedTo || "-"}</td>
            <td>${actions}</td>
          </tr>
        `;
      }).join("");
    }

    function openConvertModal(reqId) {
      const req = getFamilyRequests().find(r => r.id === reqId);
      if (!req) return;
      currentConvertRequest = req;
      document.getElementById("convert-type").value = req.type === "上门看护" ? "上门护理" : req.type === "生活物资代购" ? "上门护理" : req.type;
      document.getElementById("convert-desc").value = req.content;
      document.getElementById("convert-modal").classList.add("show");
    }

    function closeConvertModal() {
      document.getElementById("convert-modal").classList.remove("show");
      currentConvertRequest = null;
    }

    async function submitConvert() {
      if (!currentConvertRequest) return;
      const type = document.getElementById("convert-type").value;
      const desc = document.getElementById("convert-desc").value.trim();
      try {
        const newOrder = await WorkOrderAPI.create({
          elderId: String(currentConvertRequest.elderId),
          elderName: currentConvertRequest.elderName,
          orderType: type,
          description: desc || type + "服务",
          status: "待分配"
        });
        const orderId = newOrder?.orderId || newOrder?.id;
        if (orderId) {
          await ServiceRequestAPI.convert(currentConvertRequest.id, orderId);
        }
        await loadWorkOrders();
        await loadFamilyRequests();
        renderFamilyRequests();
        updateFamilyBadge();
        addAuditLog("创建工单", `工作人员 ${getCurrentUser()} 将家属申请转为工单，老人：${currentConvertRequest.elderName}`);
        closeConvertModal();
      } catch (err) {
        alert(err.message || '转工单失败');
      }
    }

    function openIgnoreModal(reqId) {
      ignoreTargetId = reqId;
      document.getElementById("ignore-modal").classList.add("show");
    }

    function closeIgnoreModal() {
      document.getElementById("ignore-modal").classList.remove("show");
      ignoreTargetId = null;
    }

    async function confirmIgnore() {
      if (!ignoreTargetId) return;
      try {
        await ServiceRequestAPI.reject(ignoreTargetId, "社区工作人员忽略");
        await loadFamilyRequests();
        renderFamilyRequests();
        updateFamilyBadge();
        addAuditLog("忽略申请", `工作人员 ${getCurrentUser()} 忽略了家属申请`);
        notifyApp({
          type: "order",
          title: "服务申请已拒绝",
          content: `服务申请已被社区拒绝`
        });
      } catch (err) {
        alert(err.message || '操作失败');
      }
      closeIgnoreModal();
    }

    // Event listeners
    document.getElementById("wo-search").addEventListener("input", renderWorkOrders);
    document.getElementById("wo-filter-status").addEventListener("change", renderWorkOrders);
    document.getElementById("wo-filter-type").addEventListener("change", renderWorkOrders);

    document.getElementById("fr-search").addEventListener("input", renderFamilyRequests);
    document.getElementById("fr-filter-status").addEventListener("change", renderFamilyRequests);
    document.getElementById("fr-filter-type").addEventListener("change", renderFamilyRequests);

    renderWorkOrders();
    updateFamilyBadge();

    // ==================== Cross-Page Sync ====================
    syncWatch(["workorders_data", "family_requests"], async () => {
      try {
        await loadWorkOrders();
        await loadFamilyRequests();
        renderWorkOrders();
        updateFamilyBadge();
        const activeTab = document.getElementById("tab-btn-family").classList.contains("active") ? "family" : "workorders";
        if (activeTab === "family") renderFamilyRequests();
      } catch (e) {}
    });
    startAutoRefresh(async () => {
      try {
        await loadWorkOrders();
        await loadFamilyRequests();
        renderWorkOrders();
        updateFamilyBadge();
        const activeTab = document.getElementById("tab-btn-family").classList.contains("active") ? "family" : "workorders";
        if (activeTab === "family") renderFamilyRequests();
      } catch (e) {}
    }, 3000);
  </script>
</body>
</html>
