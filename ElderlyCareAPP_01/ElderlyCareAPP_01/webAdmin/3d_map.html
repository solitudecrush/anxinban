<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D 社区全景 - 社区养老管理端</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    body { margin: 0; overflow: hidden; background: #0b1120; }
    #canvas-container { position: fixed; inset: 0; z-index: 1; }
    canvas { display: block; }

    /* Top Search Bar */
    .scene-search-bar {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      gap: 10px;
      align-items: center;
      background: rgba(17, 24, 39, 0.85);
      backdrop-filter: blur(10px);
      border: 1px solid #374151;
      border-radius: 12px;
      padding: 10px 16px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.4);
    }
    .scene-search-bar input {
      width: 260px;
      padding: 10px 14px;
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 8px;
      color: #f3f4f6;
      font-size: 14px;
      outline: none;
    }
    .scene-search-bar input:focus { border-color: #3b82f6; }
    .scene-search-bar input::placeholder { color: #9ca3af; }
    .scene-search-bar .btn { padding: 10px 18px; }
    .scene-search-bar .hint {
      color: #9ca3af;
      font-size: 12px;
      margin-left: 4px;
      white-space: nowrap;
    }

    /* Simulate Button */
    .scene-simulate {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 10;
    }

    /* Right Info Panel */
    .building-panel {
      position: fixed;
      top: 80px;
      right: -400px;
      width: 360px;
      z-index: 10;
      background: rgba(17, 24, 39, 0.95);
      backdrop-filter: blur(12px);
      border: 1px solid #374151;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      transition: right 0.35s cubic-bezier(0.22, 1, 0.36, 1);
      max-height: 85vh;
      overflow-y: auto;
    }
    .building-panel.show { right: 20px; }
    .building-panel .panel-close {
      position: absolute;
      top: 14px;
      right: 14px;
      background: none;
      border: none;
      color: #9ca3af;
      font-size: 22px;
      cursor: pointer;
      line-height: 1;
    }
    .building-panel .panel-close:hover { color: #f3f4f6; }
    .building-panel .panel-title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .building-panel .panel-subtitle {
      color: #9ca3af;
      font-size: 13px;
      margin-bottom: 20px;
    }
    .panel-section {
      margin-bottom: 18px;
      padding-bottom: 18px;
      border-bottom: 1px solid #374151;
    }
    .panel-section:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
    .panel-section-label {
      font-size: 12px;
      color: #9ca3af;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .panel-section-value {
      font-size: 15px;
      color: #f3f4f6;
      line-height: 1.6;
    }
    .health-cards {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .health-card {
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 10px;
      padding: 14px;
      text-align: center;
    }
    .health-card .val {
      font-size: 22px;
      font-weight: 700;
      color: #3b82f6;
      margin-bottom: 4px;
    }
    .health-card .lbl {
      font-size: 12px;
      color: #9ca3af;
    }
    .elder-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .elder-tag {
      background: rgba(59,130,246,0.12);
      color: #60a5fa;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 13px;
    }
    .intrusion-alert-mini {
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.3);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 10px;
    }
    .intrusion-alert-mini .intrusion-title {
      font-size: 13px;
      font-weight: 600;
      color: #ef4444;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .intrusion-alert-mini .intrusion-meta {
      font-size: 12px;
      color: #9ca3af;
      margin-bottom: 8px;
    }
    .intrusion-alert-mini img {
      width: 100%;
      border-radius: 6px;
      background: #1f2937;
    }

    /* Loading */
    .scene-loading {
      position: fixed;
      inset: 0;
      z-index: 20;
      background: #0b1120;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      transition: opacity 0.5s;
    }
    .scene-loading.hidden { opacity: 0; pointer-events: none; }
    .scene-loading .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid #1f2937;
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .scene-loading p { color: #9ca3af; font-size: 14px; }

    /* Tooltip */
    .scene-tooltip {
      position: fixed;
      z-index: 10;
      background: rgba(17,24,39,0.95);
      border: 1px solid #374151;
      border-radius: 8px;
      padding: 8px 12px;
      color: #f3f4f6;
      font-size: 13px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s;
      transform: translate(-50%, -120%);
    }
    .scene-tooltip.show { opacity: 1; }

    /* Back button */
    .scene-back {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 10;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div class="scene-loading" id="loading">
    <div class="spinner"></div>
    <p>正在加载 3D 社区场景...</p>
  </div>

  <a href="dashboard.html" class="btn scene-back">← 返回驾驶舱</a>

  <div class="scene-search-bar">
    <input type="text" id="search-input" placeholder="输入楼栋号，如：3号楼" value="">
    <button class="btn btn-primary" onclick="window.searchBuilding()">定位</button>
    <span class="hint">支持输入 1-8 号楼</span>
  </div>

  <div class="scene-simulate">
    <button class="btn btn-danger" onclick="window.simulateRandomIntrusion()"><i class="material-icons" style="font-size:16px;">notification_important</i> 模拟陌生人闯入</button>
  </div>

  <div class="scene-tooltip" id="tooltip"></div>

  <div class="building-panel" id="info-panel">
    <button class="panel-close" onclick="window.closePanel()">&times;</button>
    <div class="panel-title" id="panel-title">🏢 1 号楼</div>
    <div class="panel-subtitle" id="panel-subtitle">点击查看更多信息</div>

    <div class="panel-section">
      <div class="panel-section-label">基本信息</div>
      <div class="panel-section-value">
        <div style="display:flex; justify-content:space-between; margin-bottom:6px;">
          <span style="color:#9ca3af">楼栋号</span>
          <span id="info-building-num">1 号楼</span>
        </div>
        <div style="display:flex; justify-content:space-between;">
          <span style="color:#9ca3af">总户数</span>
          <span id="info-households">14 户</span>
        </div>
      </div>
    </div>

    <div class="panel-section">
      <div class="panel-section-label">入住老人</div>
      <div class="panel-section-value">
        <div class="elder-tags" id="info-elders">
          <span class="elder-tag">张德明</span>
          <span class="elder-tag">赵桂英</span>
        </div>
      </div>
    </div>

    <div class="panel-section">
      <div class="panel-section-label">健康概况（虚拟数据）</div>
      <div class="health-cards" id="info-health">
        <div class="health-card">
          <div class="val">78</div>
          <div class="lbl">心率 bpm</div>
        </div>
        <div class="health-card">
          <div class="val">128/85</div>
          <div class="lbl">血压 mmHg</div>
        </div>
        <div class="health-card">
          <div class="val">36.5</div>
          <div class="lbl">体温 °C</div>
        </div>
        <div class="health-card">
          <div class="val">98</div>
          <div class="lbl">血氧 %</div>
        </div>
      </div>
    </div>

    <div class="panel-section" id="intrusion-section" style="display:none;">
      <div class="panel-section-label">陌生人闯入记录</div>
      <div id="intrusion-list"></div>
    </div>
  </div>

  <div id="canvas-container"></div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/mock-data.js"></script>
  <script src="js/utils.js"></script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // 异步加载老人数据
    (async function() {
      try {
        await loadElderly();
        // 如果 panel 已打开，刷新数据
        const panel = document.getElementById('info-panel');
        if (panel && panel.classList.contains('show')) {
          const title = document.getElementById('panel-title').textContent;
          const buildingName = title.replace('🏢 ', '').trim();
          if (buildingName && window.openPanel) window.openPanel(buildingName);
        }
      } catch (e) {
        console.error('加载老人数据失败', e);
      }
    })();

    // ==================== Dynamic Data from API Cache ====================
    function getBuildingDatabase() {
      const elderly = getElderly();
      const db = {};
      const buildingPositions = [
        { name: '1号楼', x: -45, z: -35 },
        { name: '2号楼', x: -15, z: -35 },
        { name: '3号楼', x: 15, z: -35 },
        { name: '4号楼', x: 45, z: -35 },
        { name: '5号楼', x: -45, z: 35 },
        { name: '6号楼', x: -15, z: 35 },
        { name: '7号楼', x: 15, z: 35 },
        { name: '8号楼', x: 45, z: 35 },
      ];
      buildingPositions.forEach(bp => {
        const eldersInBuilding = elderly.filter(e => e.building === bp.name);
        const defaultHealth = { hr: 78, bp: '128/85', temp: 36.5, spo2: 98 };
        // 如果有老人，取第一个老人的健康数据；否则用默认值
        const health = eldersInBuilding.length > 0 ? {
          hr: eldersInBuilding[0].hr || defaultHealth.hr,
          bp: eldersInBuilding[0].bp || defaultHealth.bp,
          temp: eldersInBuilding[0].temp || defaultHealth.temp,
          spo2: eldersInBuilding[0].spo2 || defaultHealth.spo2
        } : defaultHealth;
        db[bp.name] = {
          households: 10 + Math.floor(Math.random() * 10),
          elders: eldersInBuilding.map(e => e.name),
          health: health
        };
      });
      return db;
    }

    // 兼容旧代码的静态引用（首次加载时填充）
    let buildingDatabase = getBuildingDatabase();

    // ==================== Scene Setup ====================
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    // Sky gradient via fog + background
    scene.background = new THREE.Color(0x87CEEB);
    scene.fog = new THREE.FogExp2(0xc9e9f6, 0.008);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 500);
    camera.position.set(0, 55, 90);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;
    container.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.maxPolarAngle = Math.PI / 2.15;
    controls.minDistance = 20;
    controls.maxDistance = 160;
    controls.target.set(0, 0, 0);

    // ==================== Sky Dome ====================
    const skyGeo = new THREE.SphereGeometry(200, 32, 32);
    const skyMat = new THREE.ShaderMaterial({
      side: THREE.BackSide,
      uniforms: {
        topColor: { value: new THREE.Color(0x0077ff) },
        bottomColor: { value: new THREE.Color(0xc9e9f6) },
        offset: { value: 20 },
        exponent: { value: 0.6 }
      },
      vertexShader: `
        varying vec3 vWorldPosition;
        void main() {
          vec4 worldPosition = modelMatrix * vec4(position, 1.0);
          vWorldPosition = worldPosition.xyz;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        uniform vec3 topColor;
        uniform vec3 bottomColor;
        uniform float offset;
        uniform float exponent;
        varying vec3 vWorldPosition;
        void main() {
          float h = normalize(vWorldPosition + offset).y;
          gl_FragColor = vec4(mix(bottomColor, topColor, max(pow(max(h, 0.0), exponent), 0.0)), 1.0);
        }
      `
    });
    scene.add(new THREE.Mesh(skyGeo, skyMat));

    // ==================== Lighting ====================
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.45);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xfff5e6, 1.2);
    dirLight.position.set(60, 100, 50);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 2048;
    dirLight.shadow.mapSize.height = 2048;
    dirLight.shadow.camera.near = 0.5;
    dirLight.shadow.camera.far = 300;
    dirLight.shadow.camera.left = -120;
    dirLight.shadow.camera.right = 120;
    dirLight.shadow.camera.top = 120;
    dirLight.shadow.camera.bottom = -120;
    dirLight.shadow.bias = -0.0005;
    scene.add(dirLight);

    const hemiLight = new THREE.HemisphereLight(0xddeeff, 0x556655, 0.35);
    scene.add(hemiLight);

    // ==================== Ground with grass texture ====================
    const groundGeo = new THREE.PlaneGeometry(300, 220);
    const groundCanvas = document.createElement('canvas');
    groundCanvas.width = 512;
    groundCanvas.height = 512;
    const gctx = groundCanvas.getContext('2d');
    gctx.fillStyle = '#6aa84f';
    gctx.fillRect(0,0,512,512);
    for (let i=0;i<8000;i++){
      gctx.fillStyle = Math.random()>0.5?'#5c9645':'#7cb85e';
      gctx.fillRect(Math.random()*512,Math.random()*512,2,2);
    }
    const groundTex = new THREE.CanvasTexture(groundCanvas);
    groundTex.wrapS = THREE.RepeatWrapping;
    groundTex.wrapT = THREE.RepeatWrapping;
    groundTex.repeat.set(10, 7);
    const groundMat = new THREE.MeshStandardMaterial({ map: groundTex, roughness: 0.95, metalness: 0 });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    // ==================== Roads ====================
    function createRoad(x, z, w, d, rotY = 0) {
      const geo = new THREE.PlaneGeometry(w, d);
      const roadCanvas = document.createElement('canvas');
      roadCanvas.width = 256;
      roadCanvas.height = 256;
      const rctx = roadCanvas.getContext('2d');
      rctx.fillStyle = '#7a7a7a';
      rctx.fillRect(0,0,256,256);
      for (let i=0;i<3000;i++){
        rctx.fillStyle = Math.random()>0.5?'#6e6e6e':'#858585';
        rctx.fillRect(Math.random()*256,Math.random()*256,2,2);
      }
      const roadTex = new THREE.CanvasTexture(roadCanvas);
      roadTex.wrapS = THREE.RepeatWrapping;
      roadTex.wrapT = THREE.RepeatWrapping;
      roadTex.repeat.set(w/8, d/8);
      const mat = new THREE.MeshStandardMaterial({ map: roadTex, roughness: 0.9 });
      const road = new THREE.Mesh(geo, mat);
      road.rotation.x = -Math.PI / 2;
      road.rotation.z = rotY;
      road.position.set(x, 0.02, z);
      road.receiveShadow = true;
      scene.add(road);

      // Road markings
      if (rotY === 0) {
        const lineGeo = new THREE.PlaneGeometry(w * 0.6, 0.3);
        const lineMat = new THREE.MeshBasicMaterial({ color: 0xffffff, opacity: 0.5, transparent: true });
        const line = new THREE.Mesh(lineGeo, lineMat);
        line.rotation.x = -Math.PI / 2;
        line.position.set(x, 0.03, z);
        scene.add(line);
      }
    }

    createRoad(0, 2, 180, 12);
    createRoad(-55, -30, 10, 100, 0);
    createRoad(-18, -30, 10, 100, 0);
    createRoad(18, -30, 10, 100, 0);
    createRoad(55, -30, 10, 100, 0);

    // ==================== Sidewalks ====================
    function createSidewalk(x, z, w, d) {
      const geo = new THREE.PlaneGeometry(w, d);
      const swCanvas = document.createElement('canvas');
      swCanvas.width = 128;
      swCanvas.height = 128;
      const sctx = swCanvas.getContext('2d');
      sctx.fillStyle = '#d0d0d0';
      sctx.fillRect(0,0,128,128);
      sctx.strokeStyle = '#b0b0b0';
      sctx.lineWidth = 1;
      for (let i=0;i<128;i+=16){
        sctx.beginPath(); sctx.moveTo(i,0); sctx.lineTo(i,128); sctx.stroke();
        sctx.beginPath(); sctx.moveTo(0,i); sctx.lineTo(128,i); sctx.stroke();
      }
      const swTex = new THREE.CanvasTexture(swCanvas);
      swTex.wrapS = THREE.RepeatWrapping;
      swTex.wrapT = THREE.RepeatWrapping;
      swTex.repeat.set(w/4, d/4);
      const mat = new THREE.MeshStandardMaterial({ map: swTex, roughness: 0.95 });
      const sw = new THREE.Mesh(geo, mat);
      sw.rotation.x = -Math.PI / 2;
      sw.position.set(x, 0.04, z);
      sw.receiveShadow = true;
      scene.add(sw);
    }
    // Sidewalks along roads
    createSidewalk(0, -6, 180, 3);
    createSidewalk(0, 10, 180, 3);
    createSidewalk(-62, -30, 3, 100);
    createSidewalk(-48, -30, 3, 100);
    createSidewalk(-25, -30, 3, 100);
    createSidewalk(-11, -30, 3, 100);
    createSidewalk(11, -30, 3, 100);
    createSidewalk(25, -30, 3, 100);
    createSidewalk(48, -30, 3, 100);
    createSidewalk(62, -30, 3, 100);

    // ==================== Building Texture Generator ====================
    function createBuildingTexture(colorHex, floors, hasWindows = true) {
      const canvas = document.createElement('canvas');
      canvas.width = 256;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');
      const color = new THREE.Color(colorHex);
      const r = Math.floor(color.r * 255);
      const g = Math.floor(color.g * 255);
      const b = Math.floor(color.b * 255);
      ctx.fillStyle = `rgb(${r},${g},${b})`;
      ctx.fillRect(0,0,256,512);
      // Add slight noise
      for (let i=0;i<5000;i++){
        const nr = Math.max(0, Math.min(255, r + (Math.random()-0.5)*20));
        const ng = Math.max(0, Math.min(255, g + (Math.random()-0.5)*20));
        const nb = Math.max(0, Math.min(255, b + (Math.random()-0.5)*20));
        ctx.fillStyle = `rgba(${nr},${ng},${nb},0.3)`;
        ctx.fillRect(Math.random()*256, Math.random()*512, 2, 2);
      }
      if (hasWindows) {
        const windowRows = Math.max(4, Math.floor(floors * 0.8));
        const windowCols = 4;
        const padX = 20;
        const padY = 16;
        const winW = (256 - padX*2) / windowCols - 8;
        const winH = (512 - padY*2) / windowRows - 10;
        for (let row=0; row<windowRows; row++) {
          for (let col=0; col<windowCols; col++) {
            const wx = padX + col * (winW + 8);
            const wy = padY + row * (winH + 10);
            // Window frame
            ctx.fillStyle = '#e0e0e0';
            ctx.fillRect(wx-2, wy-2, winW+4, winH+4);
            // Glass - some lights on, some off
            const lightsOn = Math.random() > 0.4;
            const gr = lightsOn ? 255 : 40;
            const gg = lightsOn ? 240 : 45;
            const gb = lightsOn ? 180 : 50;
            ctx.fillStyle = `rgb(${gr},${gg},${gb})`;
            ctx.fillRect(wx, wy, winW, winH);
            // Cross
            ctx.strokeStyle = lightsOn ? 'rgba(255,255,255,0.4)' : 'rgba(100,100,100,0.3)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(wx + winW/2, wy);
            ctx.lineTo(wx + winW/2, wy + winH);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(wx, wy + winH/2);
            ctx.lineTo(wx + winW, wy + winH/2);
            ctx.stroke();
          }
        }
      }
      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    // ==================== Buildings ====================
    const buildings = [];
    const buildingColors = [0xf5f5f5, 0xf0f0f0, 0xeaeaea, 0xe8e8e8];
    const roofColors = [0xe57373, 0x64b5f6, 0x81c784, 0xffb74d, 0xba68c8, 0x4dd0e1];

    const buildingPositions = [
      { name: '1号楼', x: -45, z: -35 },
      { name: '2号楼', x: -15, z: -35 },
      { name: '3号楼', x: 15, z: -35 },
      { name: '4号楼', x: 45, z: -35 },
      { name: '5号楼', x: -45, z: 35 },
      { name: '6号楼', x: -15, z: 35 },
      { name: '7号楼', x: 15, z: 35 },
      { name: '8号楼', x: 45, z: 35 },
    ];

    function createDetailedBuilding(w, h, d, color, floors) {
      const group = new THREE.Group();
      // Main body
      const tex = createBuildingTexture(color, floors);
      const mat = new THREE.MeshStandardMaterial({ map: tex, roughness: 0.75, metalness: 0.05 });
      const geo = new THREE.BoxGeometry(w, h, d);
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.y = h / 2;
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      group.add(mesh);

      // Roof
      const roofGeo = new THREE.BoxGeometry(w + 0.4, 0.6, d + 0.4);
      const roofMat = new THREE.MeshStandardMaterial({ color: 0x607d8b, roughness: 0.6 });
      const roof = new THREE.Mesh(roofGeo, roofMat);
      roof.position.y = h + 0.3;
      roof.castShadow = true;
      group.add(roof);

      // Entrance
      const doorGeo = new THREE.BoxGeometry(3, 3.5, 0.3);
      const doorMat = new THREE.MeshStandardMaterial({ color: 0x5d4037, roughness: 0.8 });
      const door = new THREE.Mesh(doorGeo, doorMat);
      door.position.set(0, 1.75, d/2 + 0.15);
      group.add(door);

      // Entrance canopy
      const canGeo = new THREE.BoxGeometry(4, 0.15, 2);
      const canMat = new THREE.MeshStandardMaterial({ color: 0x90a4ae });
      const can = new THREE.Mesh(canGeo, canMat);
      can.position.set(0, 3.6, d/2 + 0.8);
      can.castShadow = true;
      group.add(can);

      return group;
    }

    function createLabelSprite(text) {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = 256;
      canvas.height = 100;
      const r = 18, w = 256, h = 100;
      ctx.beginPath();
      ctx.moveTo(r, 0);
      ctx.lineTo(w - r, 0);
      ctx.quadraticCurveTo(w, 0, w, r);
      ctx.lineTo(w, h - r);
      ctx.quadraticCurveTo(w, h, w - r, h);
      ctx.lineTo(r, h);
      ctx.quadraticCurveTo(0, h, 0, h - r);
      ctx.lineTo(0, r);
      ctx.quadraticCurveTo(0, 0, r, 0);
      ctx.closePath();
      ctx.fillStyle = 'rgba(255,255,255,0.95)';
      ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,0.08)';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.font = 'bold 44px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
      ctx.fillStyle = '#1f2937';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(text, w/2, h/2);
      const texture = new THREE.CanvasTexture(canvas);
      texture.minFilter = THREE.LinearFilter;
      const material = new THREE.SpriteMaterial({ map: texture, depthTest: false, transparent: true });
      const sprite = new THREE.Sprite(material);
      sprite.scale.set(14, 5.5, 1);
      return sprite;
    }

    buildingPositions.forEach((bp, i) => {
      const height = 18 + Math.random() * 14;
      const floors = Math.floor(height / 3);
      const bColor = buildingColors[i % buildingColors.length];
      const building = createDetailedBuilding(14, height, 14, bColor, floors);
      building.position.set(bp.x, 0, bp.z);
      building.userData = { name: bp.name, originalColor: bColor, height, isBuilding: true };
      scene.add(building);
      buildings.push(building);

      // Label
      const label = createLabelSprite(bp.name);
      label.position.set(bp.x, height + 8, bp.z);
      scene.add(label);
      building.userData.label = label;
    });

    // ==================== Street Lights ====================
    function createStreetLight(x, z) {
      const group = new THREE.Group();
      const poleGeo = new THREE.CylinderGeometry(0.12, 0.15, 6, 8);
      const poleMat = new THREE.MeshStandardMaterial({ color: 0x4a4a4a, roughness: 0.6, metalness: 0.4 });
      const pole = new THREE.Mesh(poleGeo, poleMat);
      pole.position.y = 3;
      pole.castShadow = true;
      group.add(pole);

      const armGeo = new THREE.BoxGeometry(1.2, 0.1, 0.3);
      const arm = new THREE.Mesh(armGeo, poleMat);
      arm.position.set(0.4, 5.8, 0);
      group.add(arm);

      const lampGeo = new THREE.BoxGeometry(0.5, 0.2, 0.3);
      const lampMat = new THREE.MeshStandardMaterial({ color: 0xffffee, emissive: 0xffffee, emissiveIntensity: 0.8 });
      const lamp = new THREE.Mesh(lampGeo, lampMat);
      lamp.position.set(0.9, 5.7, 0);
      group.add(lamp);

      const pointLight = new THREE.PointLight(0xffaa33, 2, 18);
      pointLight.position.set(0.9, 5.2, 0);
      pointLight.castShadow = true;
      pointLight.shadow.bias = -0.0001;
      group.add(pointLight);

      group.position.set(x, 0, z);
      scene.add(group);
    }

    const lightPositions = [
      [-60, -10], [-30, -10], [0, -10], [30, -10], [60, -10],
      [-60, 14], [-30, 14], [0, 14], [30, 14], [60, 14],
      [-75, -35], [-75, 35], [75, -35], [75, 35]
    ];
    lightPositions.forEach(p => createStreetLight(p[0], p[1]));

    // ==================== Trees with Animation ====================
    const animatedTrees = [];
    function createTree(x, z, scale = 1) {
      const group = new THREE.Group();
      const trunkGeo = new THREE.CylinderGeometry(0.25 * scale, 0.4 * scale, 2.5 * scale, 6);
      const trunkMat = new THREE.MeshStandardMaterial({ color: 0x8d6e63, roughness: 0.9 });
      const trunk = new THREE.Mesh(trunkGeo, trunkMat);
      trunk.position.y = 1.25 * scale;
      trunk.castShadow = true;
      group.add(trunk);

      const foliageColors = [0x4caf50, 0x66bb6a, 0x43a047];
      const foliageMeshes = [];
      for (let i = 0; i < 3; i++) {
        const s = (1 - i * 0.15) * scale;
        const geo = new THREE.ConeGeometry(1.6 * s, 2.8 * s, 6);
        const mat = new THREE.MeshStandardMaterial({ color: foliageColors[i], roughness: 0.8 });
        const cone = new THREE.Mesh(geo, mat);
        cone.position.y = (2.5 + 0.8 + i * 1.4) * scale;
        cone.castShadow = true;
        group.add(cone);
        foliageMeshes.push(cone);
      }

      group.position.set(x, 0, z);
      scene.add(group);
      animatedTrees.push({ group, foliageMeshes, baseX: x, baseZ: z, phase: Math.random() * Math.PI * 2, speed: 0.5 + Math.random() * 0.5 });
    }

    const treePositions = [
      [-75,-50], [-60,-55], [-30,-55], [0,-55], [30,-55], [60,-55], [75,-50],
      [-75,50], [-60,55], [-30,55], [0,55], [30,55], [60,55], [75,50],
      [-85,-20], [-85,10], [-85,30], [85,-20], [85,10], [85,30],
      [-55,10], [-25,-15], [25,10], [55,-15], [10,15], [-10,-15],
      [-35, -10], [35, -10], [-35, 14], [35, 14]
    ];
    treePositions.forEach(p => createTree(p[0], p[1], 0.8 + Math.random() * 0.4));

    // ==================== Green Belts ====================
    function createGreenBelt(x, z, w, d) {
      const geo = new THREE.PlaneGeometry(w, d);
      const gbCanvas = document.createElement('canvas');
      gbCanvas.width = 128;
      gbCanvas.height = 128;
      const gbctx = gbCanvas.getContext('2d');
      gbctx.fillStyle = '#4a8c3a';
      gbctx.fillRect(0,0,128,128);
      for (let i=0;i<2000;i++){
        gbctx.fillStyle = Math.random()>0.5?'#3d7a30':'#569e45';
        gbctx.fillRect(Math.random()*128, Math.random()*128, 2, 2);
      }
      const gbTex = new THREE.CanvasTexture(gbCanvas);
      gbTex.wrapS = THREE.RepeatWrapping;
      gbTex.wrapT = THREE.RepeatWrapping;
      gbTex.repeat.set(w/3, d/3);
      const mat = new THREE.MeshStandardMaterial({ map: gbTex, roughness: 0.95 });
      const belt = new THREE.Mesh(geo, mat);
      belt.rotation.x = -Math.PI / 2;
      belt.position.set(x, 0.03, z);
      belt.receiveShadow = true;
      scene.add(belt);

      // Small bushes
      for (let i=0;i<3;i++){
        const bx = x + (Math.random()-0.5)*w*0.8;
        const bz = z + (Math.random()-0.5)*d*0.8;
        const bushGeo = new THREE.SphereGeometry(0.6 + Math.random()*0.4, 6, 5);
        const bushMat = new THREE.MeshStandardMaterial({ color: 0x388e3c, roughness: 0.9 });
        const bush = new THREE.Mesh(bushGeo, bushMat);
        bush.position.set(bx, 0.4, bz);
        bush.castShadow = true;
        scene.add(bush);
      }
    }
    createGreenBelt(-35, 2, 4, 60);
    createGreenBelt(35, 2, 4, 60);
    createGreenBelt(0, -25, 120, 3);
    createGreenBelt(0, 29, 120, 3);

    // ==================== Decorative Elements ====================
    // Central plaza
    const plazaGeo = new THREE.CircleGeometry(10, 32);
    const plazaMat = new THREE.MeshStandardMaterial({ color: 0xd0d0d0, roughness: 0.9 });
    const plaza = new THREE.Mesh(plazaGeo, plazaMat);
    plaza.rotation.x = -Math.PI / 2;
    plaza.position.set(0, 0.03, 2);
    plaza.receiveShadow = true;
    scene.add(plaza);

    // Fountain
    const fountainBase = new THREE.Mesh(
      new THREE.CylinderGeometry(3.2, 3.6, 0.6, 16),
      new THREE.MeshStandardMaterial({ color: 0x90a4ae, roughness: 0.5 })
    );
    fountainBase.position.set(0, 0.3, 2);
    fountainBase.receiveShadow = true;
    scene.add(fountainBase);

    const fountainWater = new THREE.Mesh(
      new THREE.CylinderGeometry(2.8, 2.8, 0.1, 16),
      new THREE.MeshStandardMaterial({ color: 0x4fc3f7, roughness: 0.2, metalness: 0.3, transparent: true, opacity: 0.85 })
    );
    fountainWater.position.set(0, 0.65, 2);
    scene.add(fountainWater);

    // Benches
    function createBench(x, z, rotY) {
      const bench = new THREE.Group();
      const seat = new THREE.Mesh(
        new THREE.BoxGeometry(3, 0.15, 1),
        new THREE.MeshStandardMaterial({ color: 0xa1887f })
      );
      seat.position.y = 0.5;
      seat.castShadow = true;
      bench.add(seat);
      [-1.2, 1.2].forEach(ox => {
        const leg = new THREE.Mesh(
          new THREE.BoxGeometry(0.2, 0.5, 0.8),
          new THREE.MeshStandardMaterial({ color: 0x616161 })
        );
        leg.position.set(ox, 0.25, 0);
        leg.castShadow = true;
        bench.add(leg);
      });
      bench.position.set(x, 0, z);
      bench.rotation.y = rotY;
      scene.add(bench);
    }
    createBench(-12, 2, 0);
    createBench(12, 2, 0);
    createBench(0, -10, Math.PI/2);
    createBench(0, 14, Math.PI/2);

    // ==================== Moving Cars ====================
    const cars = [];
    function createCar(color) {
      const group = new THREE.Group();
      const bodyGeo = new THREE.BoxGeometry(3.6, 1.2, 1.6);
      const bodyMat = new THREE.MeshStandardMaterial({ color, roughness: 0.4, metalness: 0.3 });
      const body = new THREE.Mesh(bodyGeo, bodyMat);
      body.position.y = 0.8;
      body.castShadow = true;
      group.add(body);

      const cabinGeo = new THREE.BoxGeometry(2, 0.7, 1.3);
      const cabinMat = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.2, metalness: 0.5, transparent: true, opacity: 0.7 });
      const cabin = new THREE.Mesh(cabinGeo, cabinMat);
      cabin.position.y = 1.75;
      group.add(cabin);

      const wheelGeo = new THREE.CylinderGeometry(0.3, 0.3, 0.2, 12);
      const wheelMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.9 });
      [[-1.2, 0.3, 0.7], [1.2, 0.3, 0.7], [-1.2, 0.3, -0.7], [1.2, 0.3, -0.7]].forEach(pos => {
        const wheel = new THREE.Mesh(wheelGeo, wheelMat);
        wheel.rotation.x = Math.PI / 2;
        wheel.position.set(...pos);
        group.add(wheel);
      });

      // Headlights
      const lightGeo = new THREE.BoxGeometry(0.2, 0.2, 0.4);
      const lightMat = new THREE.MeshStandardMaterial({ color: 0xffffcc, emissive: 0xffffcc, emissiveIntensity: 0.5 });
      const hl1 = new THREE.Mesh(lightGeo, lightMat);
      hl1.position.set(1.7, 0.8, 0.5);
      group.add(hl1);
      const hl2 = new THREE.Mesh(lightGeo, lightMat);
      hl2.position.set(1.7, 0.8, -0.5);
      group.add(hl2);

      const spot = new THREE.SpotLight(0xffffcc, 1, 20, Math.PI / 6, 0.5);
      spot.position.set(1.8, 1, 0);
      spot.target.position.set(10, 0, 0);
      group.add(spot);
      group.add(spot.target);

      scene.add(group);
      return group;
    }

    cars.push({ mesh: createCar(0xef4444), path: 'horizontal', pos: -80, speed: 0.15 });
    cars.push({ mesh: createCar(0x3b82f6), path: 'horizontal', pos: 80, speed: -0.12 });
    cars.push({ mesh: createCar(0x10b981), path: 'vertical_left', pos: -80, speed: 0.1 });
    cars.push({ mesh: createCar(0xf59e0b), path: 'vertical_right', pos: 80, speed: -0.08 });

    // ==================== Interaction ====================
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    let selectedBuilding = null;
    let hoveredBuilding = null;
    const tooltip = document.getElementById('tooltip');
    const infoPanel = document.getElementById('info-panel');

    function getBuildingMesh(group) {
      for (const c of group.children) {
        if (c.isMesh && c.geometry.type === 'BoxGeometry' && c.position.y > 1) return c;
      }
      return group.children[0];
    }

    function highlightBuilding(group, active) {
      if (!group) return;
      const mesh = getBuildingMesh(group);
      if (!mesh) return;
      if (active) {
        mesh.material.emissive = new THREE.Color(0xffaa00);
        mesh.material.emissiveIntensity = 0.25;
      } else {
        mesh.material.emissive = new THREE.Color(0x000000);
        mesh.material.emissiveIntensity = 0;
      }
    }

    function showTooltip(text, x, y) {
      tooltip.textContent = text;
      tooltip.style.left = x + 'px';
      tooltip.style.top = y + 'px';
      tooltip.classList.add('show');
    }
    function hideTooltip() {
      tooltip.classList.remove('show');
    }

    function openPanel(buildingName) {
      // 每次打开面板时重新从 localStorage 读取最新数据
      buildingDatabase = getBuildingDatabase();
      const data = buildingDatabase[buildingName];
      if (!data) return;
      document.getElementById('panel-title').textContent = `🏢 ${buildingName}`;
      document.getElementById('info-building-num').textContent = buildingName;
      document.getElementById('info-households').textContent = data.households + ' 户';
      document.getElementById('info-elders').innerHTML = data.elders.map(e =>
        `<span class="elder-tag">${e}</span>`
      ).join('');
      document.getElementById('info-health').innerHTML = `
        <div class="health-card"><div class="val">${data.health.hr}</div><div class="lbl">心率 bpm</div></div>
        <div class="health-card"><div class="val">${data.health.bp}</div><div class="lbl">血压 mmHg</div></div>
        <div class="health-card"><div class="val">${data.health.temp}</div><div class="lbl">体温 °C</div></div>
        <div class="health-card"><div class="val">${data.health.spo2}</div><div class="lbl">血氧 %</div></div>
      `;

      // Intrusion alerts for this building
      const intrusionSection = document.getElementById('intrusion-section');
      const intrusionList = document.getElementById('intrusion-list');
      const allIntrusions = JSON.parse(localStorage.getItem('intrusion_alerts') || '[]');
      const buildingIntrusions = allIntrusions.filter(a => a.building === buildingName);
      if (buildingIntrusions.length > 0) {
        intrusionSection.style.display = 'block';
        intrusionList.innerHTML = buildingIntrusions.map(a => `
          <div class="intrusion-alert-mini">
            <div class="intrusion-title"><i class="material-icons" style="font-size:18px;vertical-align:middle;margin-right:4px;">notification_important</i>陌生人闯入</div>
            <div class="intrusion-meta">${a.location} · ${a.time} · ${a.status === 'pending' ? '待处理' : '已处理'}</div>
            <img src="${a.snapshot}" alt="快照">
          </div>
        `).join('');
      } else {
        intrusionSection.style.display = 'none';
      }

      infoPanel.classList.add('show');
    }

    window.closePanel = function() {
      infoPanel.classList.remove('show');
      if (selectedBuilding) {
        highlightBuilding(selectedBuilding, false);
        selectedBuilding = null;
      }
    };

    function onPointerMove(event) {
      mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(buildings, true);

      if (intersects.length > 0) {
        let obj = intersects[0].object;
        while (obj.parent && !obj.userData.isBuilding) obj = obj.parent;
        if (obj.userData.isBuilding) {
          if (hoveredBuilding !== obj) {
            if (hoveredBuilding && hoveredBuilding !== selectedBuilding) {
              highlightBuilding(hoveredBuilding, false);
            }
            hoveredBuilding = obj;
            if (hoveredBuilding !== selectedBuilding) {
              highlightBuilding(hoveredBuilding, true);
            }
          }
          document.body.style.cursor = 'pointer';
          showTooltip(obj.userData.name, event.clientX, event.clientY);
        }
      } else {
        if (hoveredBuilding && hoveredBuilding !== selectedBuilding) {
          highlightBuilding(hoveredBuilding, false);
        }
        hoveredBuilding = null;
        document.body.style.cursor = 'default';
        hideTooltip();
      }
    }

    function onClick(event) {
      mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(buildings, true);

      if (intersects.length > 0) {
        let obj = intersects[0].object;
        while (obj.parent && !obj.userData.isBuilding) obj = obj.parent;
        if (!obj.userData.isBuilding) return;
        if (selectedBuilding && selectedBuilding !== obj) {
          highlightBuilding(selectedBuilding, false);
        }
        selectedBuilding = obj;
        highlightBuilding(selectedBuilding, true);

        // Smooth camera fly
        const targetPos = new THREE.Vector3(
          obj.position.x + 28,
          obj.userData.height + 18,
          obj.position.z + 38
        );
        const lookTarget = obj.position.clone();
        const startPos = camera.position.clone();
        const startTarget = controls.target.clone();
        let progress = 0;
        function animateFly() {
          progress += 0.02;
          if (progress > 1) progress = 1;
          const t = 1 - Math.pow(1 - progress, 3);
          camera.position.lerpVectors(startPos, targetPos, t);
          controls.target.lerpVectors(startTarget, lookTarget, t);
          controls.update();
          if (progress < 1) requestAnimationFrame(animateFly);
        }
        animateFly();
        openPanel(obj.userData.name);
      } else {
        window.closePanel();
      }
    }

    renderer.domElement.addEventListener('pointermove', onPointerMove);
    renderer.domElement.addEventListener('click', onClick);

    // ==================== Search / Fly To ====================
    window.searchBuilding = function() {
      const input = document.getElementById('search-input').value.trim();
      if (!input) return;
      const num = input.replace(/[^0-9]/g, '');
      const targetName = num + '号楼';
      const target = buildings.find(b => b.userData.name === targetName);
      if (!target) {
        alert('未找到该楼栋，请输入 1-8 号楼');
        return;
      }

      const endPos = new THREE.Vector3(
        target.position.x + 28,
        target.userData.height + 18,
        target.position.z + 38
      );
      const endTarget = target.position.clone();
      const startPos = camera.position.clone();
      const startTarget = controls.target.clone();

      let progress = 0;
      function animateFly() {
        progress += 0.018;
        if (progress > 1) progress = 1;
        const t = 1 - Math.pow(1 - progress, 3);
        camera.position.lerpVectors(startPos, endPos, t);
        controls.target.lerpVectors(startTarget, endTarget, t);
        controls.update();
        if (progress < 1) requestAnimationFrame(animateFly);
      }
      animateFly();

      if (selectedBuilding) highlightBuilding(selectedBuilding, false);
      selectedBuilding = target;
      highlightBuilding(selectedBuilding, true);
      openPanel(targetName);
    };

    window.simulateRandomIntrusion = function() {
      const bps = buildingPositions;
      const bp = bps[Math.floor(Math.random() * bps.length)];
      const roomNum = (Math.floor(Math.random() * 6) + 1) + '-' + (Math.floor(Math.random() * 9) + 1).toString().padStart(2, '0');
      const intrusionAlert = window.simulateIntrusion(bp.name, 1, '老人', bp.name + ' ' + roomNum);
      window.alert('已模拟陌生人闯入：' + bp.name + ' ' + roomNum);
      // Refresh panel if open for this building
      const title = document.getElementById('panel-title').textContent;
      if (title.includes(bp.name)) {
        openPanel(bp.name);
      }
    };

    document.getElementById('search-input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') window.searchBuilding();
    });

    // ==================== Resize ====================
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ==================== Render Loop ====================
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      const time = clock.getElapsedTime();

      controls.update();

      // Tree sway animation
      animatedTrees.forEach(tree => {
        const sway = Math.sin(time * tree.speed + tree.phase) * 0.03;
        tree.foliageMeshes.forEach((mesh, idx) => {
          mesh.rotation.z = sway * (1 + idx * 0.3);
          mesh.rotation.x = sway * 0.5 * (1 + idx * 0.2);
        });
      });

      // Car movement
      cars.forEach(car => {
        car.pos += car.speed;
        if (car.path === 'horizontal') {
          if (car.pos > 100) car.pos = -100;
          if (car.pos < -100) car.pos = 100;
          car.mesh.position.set(car.pos, 0, 2);
          car.mesh.rotation.y = car.speed > 0 ? 0 : Math.PI;
        } else if (car.path === 'vertical_left') {
          if (car.pos > 70) car.pos = -70;
          if (car.pos < -70) car.pos = 70;
          car.mesh.position.set(-55, 0, car.pos);
          car.mesh.rotation.y = car.speed > 0 ? Math.PI / 2 : -Math.PI / 2;
        } else if (car.path === 'vertical_right') {
          if (car.pos > 70) car.pos = -70;
          if (car.pos < -70) car.pos = 70;
          car.mesh.position.set(55, 0, car.pos);
          car.mesh.rotation.y = car.speed > 0 ? Math.PI / 2 : -Math.PI / 2;
        }
      });

      renderer.render(scene, camera);
    }

    setTimeout(() => {
      document.getElementById('loading').classList.add('hidden');
    }, 800);

    animate();

    // ==================== Cross-Page Sync for 3D Map ====================
    // 当老人数据或闯入告警变化时，如果当前 panel 打开，自动刷新
    syncWatch(["elderly_data", "intrusion_alerts"], (key) => {
      const panel = document.getElementById('info-panel');
      if (panel && panel.classList.contains('show')) {
        const title = document.getElementById('panel-title').textContent;
        const buildingName = title.replace('🏢 ', '').trim();
        if (buildingName) {
          openPanel(buildingName);
        }
      }
    });
  </script>
</body>
