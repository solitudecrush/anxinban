<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>操作日志 - 社区养老管理端</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="logo-icon"><i class="material-icons" style="font-size:20px;">home</i></div>
        <div class="logo-text">社区养老管理端</div>
      </div>
      <nav class="sidebar-nav"></nav>
      <div class="sidebar-footer">
        <div class="user-info">
          <div class="user-avatar"><i class="material-icons" style="font-size:16px;">person</i></div>
          <div>
            <div class="user-name">shequ01</div>
            <div class="user-role">社区管理员</div>
          </div>
        </div>
        <button class="btn btn-sm btn-danger btn-block" onclick="logout()">退出登录</button>
      </div>
    </aside>

    <div class="main-content">
      <header class="topbar">
        <div class="topbar-title"><i class="material-icons" style="font-size:20px;vertical-align:middle;margin-right:6px;">history</i>操作日志</div>
        <div class="topbar-time" id="clock"></div>
      </header>

      <div class="page-content">
        <div class="card">
          <div class="card-header">
            <div class="card-title">敏感操作记录（最近50条）</div>
            <div style="font-size:12px; color:var(--text-secondary);">用于审计与追溯</div>
          </div>
          <div class="log-list" id="log-list"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/mock-data.js"></script>
  <script src="js/utils.js"></script>
  <script>
    checkAuth();
    initSidebar("auditlog");

    setInterval(() => {
      document.getElementById("clock").textContent = new Date().toLocaleString("zh-CN");
    }, 1000);

    function renderLogs() {
      const logs = getAuditLogs();
      const container = document.getElementById("log-list");
      if (logs.length === 0) {
        container.innerHTML = `<div style="text-align:center; padding:40px; color:var(--text-secondary);">暂无记录</div>`;
        return;
      }
      container.innerHTML = logs.map(log => `
        <div class="log-item">
          <div class="log-time">${log.time}</div>
          <div class="log-user">${log.user}</div>
          <div class="log-action">${log.action}</div>
          <div class="log-detail">
            <div>${log.detail}</div>
            ${log.snapshot ? `<img src="${log.snapshot}" style="margin-top:8px; max-height:80px; border-radius:6px; background:#1f2937; cursor:pointer;" onclick="window.open('${log.snapshot}')" title="点击查看快照">` : ''}
          </div>
        </div>
      `).join("");
    }

    renderLogs();

    // ==================== Cross-Page Sync ====================
    syncWatch(["audit_logs"], () => {
      renderLogs();
    });
    startAutoRefresh(() => {
      renderLogs();
    }, 5000);
  </script>
</body>
</html>
