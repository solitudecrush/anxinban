spring.application.name=anxinban

# ============ 服务器端口配置 ============
server.port=8080
server.address=0.0.0.0

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:anxinban}?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jackson.serialization.FAIL_ON_EMPTY_BEANS=false

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# ============ 文件上传配置 ============
# 上传文件存储根目录（相对于项目运行目录，建议生产环境改为绝对路径）
app.upload.dir=uploads
# 网关上传允许的图片 MIME 类型（逗号分隔）
app.file.allowed.types=image/jpeg,image/png,image/webp

mqtt.enabled=true
mqtt.broker-host=localhost
mqtt.broker-port=1883
mqtt.client-id=backend-anxinban
mqtt.connection-timeout=30
mqtt.keep-alive-interval=60
mqtt.clean-session=true
mqtt.automatic-reconnect=true
mqtt.qos=1
mqtt.ssl-enabled=false
mqtt.subscribe-topics=

mqtt.simulator.enabled=false
mqtt.simulator.house-id=demo-house
mqtt.simulator.room=living-room
mqtt.simulator.interval-seconds=30

# ============ AI 外部服务配置 ============
# 队长的 Python AI 服务地址，为空则不调用外部 AI 服务，全部走 Java fallback
# 示例: http://127.0.0.1:8000 或 http://120.27.129.78:8000
ai.service.base-url=${AI_SERVICE_BASE_URL:}
# 调用外部 AI 服务的超时时间（秒）
ai.service.timeout-seconds=15
# 是否启用外部 AI 转发，设为 false 可强制走 Java fallback
ai.service.enable-forward=true

# ============ 高德地图配置 ============
# 高德开放平台 Web API Key（用于逆地理编码等），为空则不调用高德 API
amap.api.key=${AMAP_API_KEY:}
